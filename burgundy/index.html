<noscript><section><h2>진행 순서</h2><article><h3>게임 길이</h3><p>A~E의 5개 단계로 진행하며 각 단계는 5라운드입니다.</p></article><article><h3>단계 시작</h3><p>게임판에 남은 육각 타일을 제거하고 무작위로 새 타일을 채웁니다. 현재 단계의 상품 타일 5개를 준비합니다.</p></article><article><h3>단계 종료</h3><p>영지의 광산마다 은화 1개를 받습니다. 수도원 2번이 있으면 광산마다 일꾼 1개도 받습니다.</p></article><article><h3>라운드 순서</h3><p>선 플레이어가 흰 주사위를 굴려 해당 숫자의 저장소에 상품 타일을 놓습니다. 모두 주사위 2개를 동시에 굴린 뒤 순서대로 차례를 진행합니다. 다리의 순서는 오른쪽부터 왼쪽, 같은 칸에서는 위부터 아래입니다.</p></article><article><h3>내 차례</h3><p>주사위마다 행동 1번씩 총 2번 행동합니다. 추가로 검은 저장소에서 선택적으로 1번 구매할 수 있습니다.</p></article><article><h3>주사위 조정</h3><p>일꾼 1개당 주사위 결과를 +1 또는 −1 조정합니다. 1과 6 사이에서도 양방향으로 바꿀 수 있습니다.</p></article></section>
<section><h2>행동</h2><article><h3>타일 가져오기</h3><p>주사위 숫자의 저장소에서 육각 타일 1개를 가져와 개인판의 빈 보관 칸에 놓습니다.</p></article><article><h3>타일 배치하기</h3><p>보관 칸의 타일을 영지에 놓습니다. 칸의 숫자는 주사위와, 색은 타일과 일치해야 하며 이미 놓인 타일에 인접해야 합니다.</p></article><article><h3>상품 판매</h3><p>주사위 숫자에 해당하는 종류의 상품을 전부 팝니다. 은화는 판매 전체에 대해 1개, 점수는 상품 타일마다 플레이어 수만큼 2~4점을 받습니다.</p></article><article><h3>일꾼 받기</h3><p>주사위 숫자와 관계없이 일꾼 2개를 받습니다.</p></article><article><h3>검은 저장소 구매</h3><p>차례마다 한 번 은화 2개를 내고 검은 저장소의 타일 1개를 살 수 있습니다.</p></article></section>
<section><h2>기본 타일</h2><article><h3>광산 · 회색</h3><p>각 단계 종료 시 영지의 광산마다 은화 1개를 받습니다.

배치 즉시 받는 은화는 없습니다. 단계 종료 시에만 받습니다.</p></article><article><h3>배 · 파란색</h3><p>원하는 저장소 한 곳의 상품 타일을 모두 가져와 상품 보관 칸에 놓고, 다리의 순서 말을 1칸 전진합니다.

상품을 가져올 저장소는 배를 놓는 데 사용한 주사위 숫자와 무관하게 고릅니다. 상품은 최대 3종류만 보관하며 같은 종류는 쌓습니다. 보관할 수 없는 상품은 저장소에 남깁니다. 이동한 다리 칸에 말이 있으면 그 위에 놓습니다.</p></article><article><h3>성 · 진한 초록색</h3><p>즉시 추가 행동 1번을 합니다.

원하는 주사위 숫자 하나가 있는 것처럼 행동을 선택합니다. 추가 주사위를 소비하지 않습니다.</p></article><article><h3>가축 · 연한 초록색</h3><p>놓은 타일의 가축 수만큼 즉시 점수를 받습니다. 같은 목초지에 있는 같은 종류의 기존 가축도 다시 계산합니다. 서로 직접 인접할 필요는 없지만 다른 목초지의 가축은 제외합니다.

거위 2마리: 배치 시 2점에 더해 같은 목초지의 가축 한 종류를 골라 추가로 계산합니다. 이후 같은 목초지에 다른 가축 타일을 놓을 때마다 거위도 2점으로 다시 계산합니다. 종료 시 수도원 24번에서는 별도의 종류입니다.</p></article></section>
<section><h2>건물 · 고유 번호 없음</h2><article><h3>시장</h3><p>게임판에서 가축 또는 배 타일 1개를 가져옵니다.

6개 일반 저장소에서만 고릅니다. 중앙 검은 저장소는 제외하며, 가져온 타일은 영지에 바로 놓지 않고 개인판의 빈 보관 칸에 놓습니다.</p></article><article><h3>목공소</h3><p>게임판에서 원하는 건물 타일 1개를 가져옵니다.

6개 일반 저장소에서만 고릅니다. 중앙 검은 저장소는 제외하며, 가져온 타일은 영지에 바로 놓지 않고 개인판의 빈 보관 칸에 놓습니다.</p></article><article><h3>교회</h3><p>게임판에서 광산, 수도원 또는 성 타일 1개를 가져옵니다.

6개 일반 저장소에서만 고릅니다. 중앙 검은 저장소는 제외하며, 가져온 타일은 영지에 바로 놓지 않고 개인판의 빈 보관 칸에 놓습니다.</p></article><article><h3>창고</h3><p>원하는 종류의 상품을 판매합니다.

추가 주사위 없이 선택한 종류의 상품을 전부 판매합니다. 은화는 총 1개, 점수는 상품 타일마다 플레이어 수만큼 2~4점을 받으며 관련 수도원 효과도 적용합니다.</p></article><article><h3>하숙집</h3><p>일꾼 4개를 받습니다.

수도원 13·14번의 일꾼 받기 행동 보너스는 하숙집에 적용하지 않습니다.</p></article><article><h3>은행</h3><p>은화 2개를 받습니다.</p></article><article><h3>시청</h3><p>육각 타일 1개를 추가로 배치합니다.

개인 보관 칸의 타일을 선택하며 색은 자유입니다. 추가 주사위 없이 배치하되 색상·인접 조건은 지킵니다. 새로 놓은 타일의 효과도 정상 발동합니다.</p></article><article><h3>감시탑</h3><p>승점 4점을 받습니다.</p></article></section>
<section><h2>수도원</h2><article><h3>1 · 중복 건물 허용</h3><p>같은 도시 안에 같은 종류의 건물을 여러 개 지을 수 있습니다.</p></article><article><h3>2 · 광산의 일꾼</h3><p>각 단계 종료 시 배치한 광산마다 은화에 더해 일꾼 1개를 받습니다.</p></article><article><h3>3 · 판매 은화 증가</h3><p>주사위 행동 또는 창고 배치로 상품을 팔 때 은화를 1개 대신 2개 받습니다.</p></article><article><h3>4 · 판매 시 일꾼</h3><p>주사위 행동 또는 창고 배치로 한 종류의 상품을 팔 때 평소 받는 은화에 더해 일꾼 1개를 받습니다.</p></article><article><h3>5 · 인접 저장소 상품</h3><p>배를 놓을 때 선택한 저장소의 상품에 더해 인접한 저장소 한 곳의 상품도 전부 가져올 수 있습니다.</p></article><article><h3>6 · 일꾼으로 타일 구매</h3><p>차례당 한 번, 은화와 일꾼을 원하는 조합으로 총 2개 지불하고 타일 1개를 구매할 수 있습니다(은화 2개 / 은화 1개+일꾼 1개 / 일꾼 2개). 중앙 검은 저장소뿐 아니라 6개 일반 저장소에서도 고를 수 있습니다. 별도의 추가 구매가 아니며 가져온 타일은 보관 칸에 놓습니다.</p></article><article><h3>7 · 가축 타일 추가 점수</h3><p>가축 타일 배치 시 같은 목초지의 같은 종류 가축에 대한 점수에 더해 이번에 점수를 계산하는 가축 타일마다 1점을 추가로 받습니다.</p></article><article><h3>8 · 일꾼 조정 강화</h3><p>일꾼으로 주사위를 조정할 때 1 대신 2를 더하거나 뺄 수 있습니다.</p></article><article><h3>9 · 건물 배치 조정</h3><p>건물 타일을 영지에 배치할 때 일꾼을 쓴 것처럼 주사위 결과를 1 조정할 수 있습니다.</p></article><article><h3>10 · 배·가축 배치 조정</h3><p>배 또는 가축 타일을 영지에 배치할 때 일꾼을 쓴 것처럼 주사위 결과를 1 조정할 수 있습니다.</p></article><article><h3>11 · 성·광산·수도원 배치 조정</h3><p>성, 광산 또는 수도원 타일을 영지에 배치할 때 일꾼을 쓴 것처럼 주사위 결과를 1 조정할 수 있습니다.</p></article><article><h3>12 · 타일 획득 조정</h3><p>게임판에서 육각 타일을 가져올 때 일꾼을 쓴 것처럼 주사위 결과를 1 조정할 수 있습니다.</p></article><article><h3>13 · 일꾼 행동의 은화</h3><p>일꾼 받기 행동을 할 때 일꾼 2개에 더해 은화 1개를 받습니다.

하숙집 배치로 받는 일꾼에는 적용하지 않습니다.</p></article><article><h3>14 · 일꾼 4개 받기</h3><p>일꾼 받기 행동을 할 때 평소의 2개 대신 4개를 받습니다.

하숙집 배치로 받는 일꾼에는 적용하지 않습니다.</p></article><article><h3>15 · 판매 상품 종류 점수</h3><p>게임 종료 시 한 번 이상 판매한 상품 종류마다 2점을 받습니다. 미판매 상품은 제외합니다. 판매한 상품 더미는 언제든 확인할 수 있습니다.</p></article><article><h3>16–23 · 29 · 건물 종류별 종료 점수</h3><p>게임 종료 시 해당 수도원 타일에 표시된 종류의 건물을 영지에 배치한 수만큼 건물마다 4점을 받습니다.

16~23번과 29번은 건물 자체의 번호가 아니라, 건물별 종료 점수를 주는 노란 수도원 타일 번호입니다. 예: 17번은 감시탑, 22번은 은행에 점수를 줍니다. 건물 타일 자체에는 고유 번호가 없습니다.</p></article><article><h3>24 · 가축 종류 점수</h3><p>게임 종료 시 영지에 배치한 가축 종류마다 4점을 받습니다.</p></article><article><h3>25 · 판매 상품 개수 점수</h3><p>게임 종료 시 판매한 상품 타일마다 1점을 받습니다. 미판매 상품은 제외합니다.</p></article><article><h3>26 · 보너스 타일 점수</h3><p>게임 종료 시 보유한 큰 보너스 타일과 작은 보너스 타일마다 3점을 받습니다.</p></article><article><h3>27 · 다리</h3><p>순서 말이 다른 말과 같은 칸에 쌓이면 항상 맨 위에 놓습니다. 내가 그 칸으로 이동할 때도, 다른 말이 내 칸으로 이동해 올 때도 적용합니다.</p></article><article><h3>28 · 일꾼 구매</h3><p>공급처에서 일꾼을 살 수 있습니다. 은화 1개로 일꾼 2개를 받습니다.</p></article></section>
<section><h2>추가 타일</h2><article><h3>기중기 · 검은 저장소 건물</h3><p>원하는 건물의 효과를 즉시 발동할 수 있습니다. 그 건물이 내 영지에 없어도 됩니다.

게임 종료 시: 수도원 16~23번 및 29번의 점수를 계산할 때 원하는 건물 종류 하나로 간주합니다. 배치 시 효과를 사용한 건물과 다른 종류를 선택해도 됩니다.</p></article><article><h3>거위 2마리 · 검은 저장소 가축</h3><p>거위 2마리를 배치하면 기본 2점에 더해 같은 목초지의 가축 한 종류를 골라 그 종류의 가축 수만큼 추가 점수를 받습니다. 모든 종류를 동시에 계산하지 않습니다.
이후 같은 목초지에 다른 가축 타일을 놓을 때마다 거위 타일도 2점으로 다시 계산합니다.
게임 종료 시 수도원 24번에서는 거위를 별도의 가축 종류로 셉니다.</p></article><article><h3>흰 성</h3><p>배치 즉시 현재 흰 주사위 숫자를 사용해 행동 1번을 합니다. 일꾼으로 숫자를 조정할 수 있지만 실제 흰 주사위는 돌리지 않습니다.</p></article><article><h3>여관</h3><p>각 단계에 검은 저장소 옆에 1개를 추가하며 남은 여관은 제거하지 않고 쌓습니다. 은화 2개로 사서 개인 보관 칸에 놓습니다. 일반 배치 규칙을 지키며 영지의 어떤 색 칸에도 놓을 수 있으나 같은 색 영역당 최대 1개입니다. 자체 효과는 없으며, 영역 완성 점수 계산 시 영역 크기를 1 늘립니다. 기념판에서는 최대 크기 8까지입니다.</p></article></section>
<section><h2>점수</h2><article><h3>배치 효과와 도시 제한</h3><p>광산을 제외한 타일의 추가 효과는 영지에 배치할 때만 발동합니다. 같은 도시에는 같은 건물을 중복 배치할 수 없습니다(수도원 1번 예외).

건물 효과는 배치 즉시 한 번만 사용하며 추가 주사위나 행동이 필요 없습니다. 효과를 사용할 수 없어도 건물을 놓을 수 있지만 효과를 나중으로 미룰 수는 없습니다. 획득한 타일은 반드시 보관 칸을 거치며, 영지에 놓은 타일은 이동·제거·교체할 수 없습니다. 수도원은 영지에 배치해야 효과가 적용됩니다.</p></article><article><h3>영역 완성과 색상 보너스</h3><p>영역 완성 시 크기 점수와 단계 점수를 모두 받습니다. 크기 1/2/3/4/5/6/7/8칸 → 1/3/6/10/15/21/28/36점. 단계 A/B/C/D/E → 10/8/6/4/2점. 영지 전체에서 한 색의 모든 칸을 먼저 채우면 큰 보너스 타일(2/3/4인: 5/6/7점), 두 번째면 작은 보너스 타일(2/3/4인: 2/3/4점)을 받습니다.</p></article><article><h3>게임 종료 점수</h3><p>미판매 상품 1개당 1점, 남은 은화 1개당 1점, 일꾼 2개당 1점을 받습니다. 영지에 놓은 종료 점수 수도원도 계산합니다. 보관 칸에 남은 타일은 점수를 받지 않습니다.</p></article></section></noscript>
