<noscript><section><h2>글로벌 임팩트 카드</h2><article><h3>세계 사건 예시 · 화학물질 유출</h3><p>카드 순서대로 처리합니다. 이 카드에서는 모두가 대기 줄의 빈 칸을 점수로 계산하고, 산업 시장을 새로 채운 뒤, 각자 환경의 같은 줄에 오염 2개를 놓습니다. 두 칸이 모두 들어갈 줄을 골라야 합니다.</p></article><article><h3>세계 사건 예시 · 저가 수입품</h3><p>카드 효과로 상업 행동칸마다 플라스틱 1개를 놓습니다. 그 행동칸을 먼저 사용하는 사람은 행동 전에 해당 플라스틱을 가져갑니다.</p></article></section>
<section><h2>게임판 행동칸</h2><article><h3>정부 위치</h3><p>정부 시장: 정부 구조물 1장을 구매합니다. 과학 연구: 과학 1개를 얻고 임팩트 카드 1장을 비공개로 봅니다. 교육: 3달러로 일꾼 1개를 얻고 오염 1개를 얻습니다. 청소: 과학 1개로 청소 2회를 합니다.</p></article><article><h3>산업 위치</h3><p>산업 시장: 산업 구조물 1장을 구매합니다. 광산: 강철 1개. 석유 시추: 빈 시추 칸에 유정 1개를 놓고 석유 3개. 화학: 석유 1개로 플라스틱 2개·과학 1개·오염 1개. 발전소: 표시된 비용을 내고 에너지 주사위 1개를 얻습니다.</p></article><article><h3>상업 위치</h3><p>상업 시장: 상업 구조물 1장을 구매합니다. 재정: 2달러, 또는 상대에게 돈을 주고 3/4달러를 얻습니다. 석유 매매: 현재 가격으로 석유 3개를 사거나 팝니다. 거래: 2달러·플라스틱·강철·과학 사이에서 원하는 만큼 교환합니다.</p></article></section>
<section><h2>국가 카드</h2><article><h3>기본판 국가 10종</h3><p>영국 · 일본 · 사우디아라비아 · 중국 · 소련 · 캐나다 · 서독 · 프랑스 · 미국 · 인도.
국가마다 시작 보너스와 UN 전진 비용이 다르므로, 뽑은 카드가 초반 운영 방향을 정합니다.</p></article><article><h3>국가 카드 비용 예시</h3><p>미국은 돈과 석유를 내고, 프랑스는 과학 1개와 2달러를 내고, 캐나다는 과학 1개와 강철 1개를 내고 UN 트랙을 전진합니다. 나머지 국가도 카드에 적힌 비용만 다를 뿐, 사용하는 방식은 같습니다.</p></article><article><h3>국가 카드 예시 · 미국</h3><p>국가 카드의 앞면에는 시작 보너스, UN 트랙을 한 칸 전진하기 위한 비용, 행동칸이 함께 표시됩니다. 미국 카드도 이 공통 형식을 따릅니다.</p></article></section>
<section><h2>업적 타일</h2><article><h3>수상 경력</h3><p>내가 가진 업적 타일 수만큼 점수를 받습니다. 이 타일도 포함합니다.</p></article><article><h3>깨끗한 대기</h3><p>대기 줄의 빈 칸마다 1점입니다.</p></article><article><h3>상업 제국</h3><p>내 상업 시설 카드 1장마다 1점입니다.</p></article><article><h3>문화유산</h3><p>내 정부 시설 카드 1장마다 1점입니다.</p></article><article><h3>다각화</h3><p>남은 자원의 종류마다 1점입니다. 돈·플라스틱·강철·과학·석유를 각각 따로 셉니다.</p></article><article><h3>에너지 제국</h3><p>개인 보드의 에너지 주사위 1개마다 1점입니다. 이번 생산 차례에만 쓰는 석유 주사위는 제외합니다.</p></article><article><h3>에너지 비축</h3><p>개인 보드에 남은 에너지 1개마다 1점입니다.</p></article><article><h3>세계적 영향력</h3><p>게임 중 UN 트랙에서 전진한 칸마다 1점입니다.</p></article><article><h3>건강한 숲</h3><p>숲 줄의 빈 칸마다 1점입니다.</p></article><article><h3>건강한 바다</h3><p>바다 줄의 빈 칸마다 1점입니다.</p></article><article><h3>선도적 소비자</h3><p>빨간 비용 화살표가 있는 내 시설 카드 1장마다 1점입니다.</p></article><article><h3>핵 역량</h3><p>환경에 있는 핵 오염 1개마다 1점입니다.</p></article><article><h3>석유 생산</h3><p>환경에 있는 유정 1개마다 1점, 그리고 추가로 1점을 더 받습니다.</p></article><article><h3>석유 비축</h3><p>남은 석유 통 1개마다 1점입니다.</p></article><article><h3>과학 선도국</h3><p>남은 과학 토큰 1개마다 1점입니다.</p></article><article><h3>강철 제국</h3><p>남은 강철 1개마다 1점입니다.</p></article><article><h3>강한 노동력</h3><p>보유 일꾼 수에서 1을 뺀 만큼 점수를 받습니다. 개인 보드·게임판·카드 위의 일꾼은 모두 세고, 공급처에 남은 일꾼만 제외합니다.</p></article><article><h3>합성소재 개척자</h3><p>남은 플라스틱 1개마다 1점입니다.</p></article><article><h3>산업 거물</h3><p>내 산업 시설 카드 1장마다 1점입니다.</p></article><article><h3>부</h3><p>남은 돈 2달러마다 1점입니다. 홀수 1달러는 버립니다.</p></article></section>
<section><h2>콜드 워 카드</h2><article><h3>메가 구조물</h3><p>메가 구조물을 섞어 플레이어 수+1장을 공개합니다. 해당 시장에서 일반 구조물 대신 구매하되, 카드 왼쪽 아래 최소 조건과 오른쪽 아래 자원 비용을 모두 충족해야 합니다. 테이블에는 놓지만 게임상 '구조물'로는 취급하지 않으며 종료 시 점수 냅니다.</p></article><article><h3>첩보</h3><p>각자 첩보 카드 1장을 받습니다. Work 턴에 자기 카드처럼 활성화해 행동 칸에 일꾼/에너지 1개를 놓고, 이번에 쓴 메인보드 영역과 같은 종류의 다른 플레이어 구조물 1개를 즉시 사용합니다. 대상 구조물은 사용 가능해야 하며 소유자는 1달러를 받습니다.</p></article><article><h3>브리지 구조물</h3><p>석조 다리·현수교·고가도로를 활성화하면, 자기 매트의 일꾼 1개를 같은 종류의 비어 있는 메인보드 영역에 추가 배치하고 즉시 그 행동을 합니다. '비어 있음'은 일꾼이 없는 상태이며 토큰·자원은 있어도 됩니다.</p></article></section></noscript>
