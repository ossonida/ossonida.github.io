<noscript><section><h2>준비·차례 규칙</h2><article><h3>기본 준비</h3><p>글로벌 임팩트는 초기 3장·후기 3장을 순서대로 뒷면으로 놓습니다. 정부·산업·상업 시장은 각각 3장으로 채우고 업적 3개를 공개합니다. 각자 시작 오염 1개, 일꾼 3개, 에너지 2개를 받고 국가·업적 2개씩에서 하나를 선택한 뒤 국가 보너스를 받습니다.</p></article><article><h3>글로벌 임팩트 트랙</h3><p>플레이어 수에 맞는 수의 오염 토큰을 여섯 칸마다 쌓습니다. 2인전에는 사용하지 않는 색의 중립 일꾼을 세 구조물 시장에 하나씩 영구 배치합니다.</p></article><article><h3>내 차례에 할 일</h3><p>매 차례에 둘 중 하나를 고릅니다.
• 행동 차례: 일꾼을 놓고 행동합니다.
• 에너지 생산 차례: 일꾼을 회수하고 에너지를 만듭니다.
개인 보드에 일꾼이 하나도 없으면 반드시 에너지 생산을 해야 합니다. 직전 차례에 에너지 생산을 했다면, 이번에는 반드시 행동 차례를 합니다.</p></article></section>
<section><h2>행동 차례</h2><article><h3>일꾼·에너지 쌓기</h3><p>게임판 위치에는 일꾼 1개가 맨 위에 오도록 놓습니다. 이미 일꾼이 있다면 새 더미가 가장 높아야 하므로 그 아래에 충분한 에너지를 쌓아야 합니다. 이전 더미에 덧붙일 수 없고, 행동 비용을 낼 수 있을 때만 배치합니다.</p></article><article><h3>행동 차례 순서</h3><p>1. 게임판 행동칸 하나에 일꾼을 놓고, 그 칸의 효과를 처리합니다.
2. 방금 사용한 행동칸과 같은 색의 내 시설 카드를 원하는 만큼 사용합니다.
3. 국가 카드는 색 제한 없이 함께 사용할 수 있습니다.</p></article><article><h3>구조물·국가 카드 활성화</h3><p>비어 있는 행동 칸에 표시된 일꾼/에너지를 올리고 비용이 있으면 지불한 뒤 효과를 반드시 해결합니다. 2개의 단일 행동 칸이 있는 카드는 한 턴에 한 칸만 사용할 수 있습니다. 국가 카드는 일반 구조물처럼 사용하며 UN 트랙을 전진시킵니다.</p></article></section>
<section><h2>에너지 생산·환경</h2><article><h3>에너지 생산 차례 순서</h3><p>1. 개인 보드에 일꾼·에너지가 합쳐서 2개 이상 남았으면 업적 타일 1개를 가져올 수 있습니다.
2. 게임판과 카드에 놓인 내 일꾼을 전부 회수하고, 남은 에너지는 전부 버립니다.
3. 석유를 최대 4개까지 정제해 이번 차례에만 쓰는 석유 주사위로 바꿉니다.
4. 원하는 에너지 주사위를 굴려 에너지를 얻습니다.
5. 가장 높은 주사위 눈으로 오염을 처리합니다.</p></article><article><h3>업적 획득</h3><p>발전 시작 시 매트에 남은 일꾼과 에너지 합이 2개 이상이면 공개 업적 하나를 뒷면으로 가져오고 즉시 새 업적으로 보충합니다. 업적은 최대 5개까지 보유하며, 각 업적의 종료 점수도 최대 5점입니다.</p></article><article><h3>주사위 발전</h3><p>굴린 주사위의 에너지 아이콘 총합만큼 에너지를 얻습니다. 석유 주사위는 이 발전에만 쓰는 임시 주사위이며 굴린 뒤 공급처로 돌아갑니다. 굴린 주사위 중 가장 높은 눈 하나가 오염 결과를 정하며 동점이면 선택합니다.</p></article><article><h3>주사위 오염 판정</h3><p>녹색 태양광/풍력·파란 수력지열이 최고이거나 주사위를 안 굴렸다면 트랙의 오염 1개를 버립니다. 검정 석탄·갈색 석유가 최고면 일반 오염 1개를, 노랑 원자력이 최고면 핵 오염 1개를 환경의 빈 칸에 놓습니다.</p></article><article><h3>환경과 오염 배치</h3><p>환경은 대기·숲·바다 세 줄입니다. 오염, 핵 오염, 유정 중 하나가 있는 칸은 오염된 칸이며 토큰을 재배치할 수 없습니다. 지시된 줄이 가득 차면 다른 빈 환경 칸에 놓고, 빈 칸이 전혀 없으면 해당 토큰은 버립니다.</p></article><article><h3>청소 행동</h3><p>청소 기호 하나마다 다음 중 하나를 수행합니다: 일반 오염 1개 제거, 유정 1개 제거, 또는 핵 오염 1개를 뒤집어 일반 오염으로 바꾸기. 핵 오염은 직접 제거할 수 없습니다.</p></article></section>
<section><h2>세계 사건·점수</h2><article><h3>글로벌 임팩트 발동</h3><p>트랙의 한 칸이 처음 비면 현재 행동을 끝낸 뒤 이전 공개 임팩트를 버리고 다음 카드를 공개·해결한 후 차례를 이어갑니다. 가장 왼쪽에 남은 오염 칸 아래 숫자가 현재 석유 1개 가격입니다.</p></article><article><h3>글로벌 임팩트 해결</h3><p>공개된 카드는 모든 플레이어에게 적용됩니다. 표시된 환경 줄의 빈 칸마다 1점씩 점수 내고, 표시된 구조물 시장을 모두 버린 뒤 오른쪽부터 다시 채우며, 마지막으로 카드의 특수 효과를 해결합니다.</p></article><article><h3>게임 종료와 최종 점수</h3><p>세계 사건 트랙의 마지막 오염 토큰이 사라지면 종료가 시작됩니다. 지금 차례를 끝낸 뒤, 모두가 한 차례씩 더 합니다.
최종 점수 = 시설 카드 점수 + 에너지 주사위(개당 2점) + 업적 타일 + 깨끗한 환경 + UN 트랙 점수.
동점이면 남은 돈(2달러당 1점), 플라스틱, 강철, 과학, 석유의 합이 높은 쪽이 이깁니다.</p></article><article><h3>UN 트랙</h3><p>국가 카드 효과로 UN 트랙을 전진합니다. 종료 시 해당 칸의 VP를 얻고, 가장 멀리 간 플레이어는 3점 리더 보너스를 받습니다. 동점이면 보너스를 균등 분배하고 내림합니다. 마지막 칸은 한 마커만 들어갈 수 있습니다.</p></article><article><h3>세계 사건 예시 · 화학물질 유출</h3><p>카드 순서대로 처리합니다. 이 카드에서는 모두가 대기 줄의 빈 칸을 점수로 계산하고, 산업 시장을 새로 채운 뒤, 각자 환경의 같은 줄에 오염 2개를 놓습니다. 두 칸이 모두 들어갈 줄을 골라야 합니다.</p></article><article><h3>세계 사건 예시 · 저가 수입품</h3><p>카드 효과로 상업 행동칸마다 플라스틱 1개를 놓습니다. 그 행동칸을 먼저 사용하는 사람은 행동 전에 해당 플라스틱을 가져갑니다.</p></article></section>
<section><h2>게임판 행동칸</h2><article><h3>정부 위치</h3><p>정부 시장: 정부 구조물 1장을 구매합니다. 과학 연구: 과학 1개를 얻고 임팩트 카드 1장을 비공개로 봅니다. 교육: 3달러로 일꾼 1개를 얻고 오염 1개를 얻습니다. 청소: 과학 1개로 청소 2회를 합니다.</p></article><article><h3>산업 위치</h3><p>산업 시장: 산업 구조물 1장을 구매합니다. 광산: 강철 1개. 석유 시추: 빈 시추 칸에 유정 1개를 놓고 석유 3개. 화학: 석유 1개로 플라스틱 2개·과학 1개·오염 1개. 발전소: 표시된 비용을 내고 에너지 주사위 1개를 얻습니다.</p></article><article><h3>상업 위치</h3><p>상업 시장: 상업 구조물 1장을 구매합니다. 재정: 2달러, 또는 상대에게 돈을 주고 3/4달러를 얻습니다. 석유 매매: 현재 가격으로 석유 3개를 사거나 팝니다. 거래: 2달러·플라스틱·강철·과학 사이에서 원하는 만큼 교환합니다.</p></article><article><h3>구조물 시장</h3><p>시장 위치에 일꾼을 놓으면 그 시장의 구조물 1장을 비용(돈 또는 해당 자원만)으로 구매합니다. 카드는 즉시 사용할 수 있고, 비면 남은 카드를 왼쪽으로 민 뒤 오른쪽에 새 카드를 보충합니다. 새 구조물의 오염/핵 오염은 획득 즉시 한 번만 적용합니다.</p></article></section>
<section><h2>국가 카드</h2><article><h3>국가 카드 선택</h3><p>준비할 때 국가 카드 2장 중 1장을 고릅니다. 고른 카드는 앞면으로 놓고, 카드에 적힌 시작 자원·돈·주사위·추가 일꾼을 받습니다. 선택하지 않은 카드는 뒷면의 요약표로 사용합니다.</p></article><article><h3>국가 카드 사용법</h3><p>행동 차례에만 사용할 수 있습니다. 방금 쓴 게임판 행동칸의 색과 상관없이, 국가 카드의 빈 행동칸에 일꾼 또는 에너지 1개를 놓고 카드의 비용을 냅니다. 그러면 UN 트랙에서 1칸 전진합니다. 카드에 토큰이 남아 있는 동안에는 다시 쓸 수 없습니다.</p></article><article><h3>기본판 국가 10종</h3><p>영국 · 일본 · 사우디아라비아 · 중국 · 소련 · 캐나다 · 서독 · 프랑스 · 미국 · 인도.
국가마다 시작 보너스와 UN 전진 비용이 다르므로, 뽑은 카드가 초반 운영 방향을 정합니다.</p></article><article><h3>국가 카드 비용 예시</h3><p>미국은 돈과 석유를 내고, 프랑스는 과학 1개와 2달러를 내고, 캐나다는 과학 1개와 강철 1개를 내고 UN 트랙을 전진합니다. 나머지 국가도 카드에 적힌 비용만 다를 뿐, 사용하는 방식은 같습니다.</p></article><article><h3>국가 카드 예시 · 미국</h3><p>국가 카드의 앞면에는 시작 보너스, UN 트랙을 한 칸 전진하기 위한 비용, 행동칸이 함께 표시됩니다. 미국 카드도 이 공통 형식을 따릅니다.</p></article></section>
<section><h2>업적 타일</h2><article><h3>업적 타일 공통 규칙</h3><p>업적은 개인 목표입니다. 에너지 생산 차례 시작에 개인 보드에 남은 일꾼+에너지가 2개 이상이면 공개 업적 하나를 가져옵니다. 업적은 최대 5개까지 보유하며, 각 타일은 조건을 충족해도 최대 5점까지만 얻습니다.</p></article><article><h3>수상 경력</h3><p>내가 가진 업적 타일 수만큼 점수를 받습니다. 이 타일도 포함합니다.</p></article><article><h3>깨끗한 대기</h3><p>대기 줄의 빈 칸마다 1점입니다.</p></article><article><h3>상업 제국</h3><p>내 상업 시설 카드 1장마다 1점입니다.</p></article><article><h3>문화유산</h3><p>내 정부 시설 카드 1장마다 1점입니다.</p></article><article><h3>다각화</h3><p>남은 자원의 종류마다 1점입니다. 돈·플라스틱·강철·과학·석유를 각각 따로 셉니다.</p></article><article><h3>에너지 제국</h3><p>개인 보드의 에너지 주사위 1개마다 1점입니다. 이번 생산 차례에만 쓰는 석유 주사위는 제외합니다.</p></article><article><h3>에너지 비축</h3><p>개인 보드에 남은 에너지 1개마다 1점입니다.</p></article><article><h3>세계적 영향력</h3><p>게임 중 UN 트랙에서 전진한 칸마다 1점입니다.</p></article><article><h3>건강한 숲</h3><p>숲 줄의 빈 칸마다 1점입니다.</p></article><article><h3>건강한 바다</h3><p>바다 줄의 빈 칸마다 1점입니다.</p></article><article><h3>선도적 소비자</h3><p>빨간 비용 화살표가 있는 내 시설 카드 1장마다 1점입니다.</p></article><article><h3>핵 역량</h3><p>환경에 있는 핵 오염 1개마다 1점입니다.</p></article><article><h3>석유 생산</h3><p>환경에 있는 유정 1개마다 1점, 그리고 추가로 1점을 더 받습니다.</p></article><article><h3>석유 비축</h3><p>남은 석유 통 1개마다 1점입니다.</p></article><article><h3>과학 선도국</h3><p>남은 과학 토큰 1개마다 1점입니다.</p></article><article><h3>강철 제국</h3><p>남은 강철 1개마다 1점입니다.</p></article><article><h3>강한 노동력</h3><p>보유 일꾼 수에서 1을 뺀 만큼 점수를 받습니다. 개인 보드·게임판·카드 위의 일꾼은 모두 세고, 공급처에 남은 일꾼만 제외합니다.</p></article><article><h3>합성소재 개척자</h3><p>남은 플라스틱 1개마다 1점입니다.</p></article><article><h3>산업 거물</h3><p>내 산업 시설 카드 1장마다 1점입니다.</p></article><article><h3>부</h3><p>남은 돈 2달러마다 1점입니다. 홀수 1달러는 버립니다.</p></article></section>
<section><h2>콜드 워 모듈</h2><article><h3>확장 모듈 사용</h3><p>콜드 워는 본판이 필요하며 다른 맨해튼 프로젝트 게임과는 호환되지 않습니다. 새 국가, 메가 구조물, 첩보, 새 글로벌 임팩트, 새 구조물, 종말 시계·콜드 워 카드 모듈은 각각 단독 또는 조합해 사용할 수 있습니다.</p></article><article><h3>새 국가 카드</h3><p>새 국가 7장을 기존 국가 덱에 섞습니다. 원한다면 시작 시 국가 2장 대신 3장을 받고 하나를 선택할 수 있습니다. 사용 방식은 본판 국가 카드와 같습니다.</p></article><article><h3>메가 구조물</h3><p>메가 구조물을 섞어 플레이어 수+1장을 공개합니다. 해당 시장에서 일반 구조물 대신 구매하되, 카드 왼쪽 아래 최소 조건과 오른쪽 아래 자원 비용을 모두 충족해야 합니다. 테이블에는 놓지만 게임상 '구조물'로는 취급하지 않으며 종료 시 점수 냅니다.</p></article><article><h3>첩보</h3><p>각자 첩보 카드 1장을 받습니다. Work 턴에 자기 카드처럼 활성화해 행동 칸에 일꾼/에너지 1개를 놓고, 이번에 쓴 메인보드 영역과 같은 종류의 다른 플레이어 구조물 1개를 즉시 사용합니다. 대상 구조물은 사용 가능해야 하며 소유자는 1달러를 받습니다.</p></article><article><h3>새 구조물 개념</h3><p>새 구조물은 기존 구조물 덱에 섞습니다. 생산 턴 구조물 효과는 발전 시작 또는 실제 에너지 생산 때 자동 적용됩니다. 와일드 카드 구조물은 같은 종류 시장의 카드를 선택해 비용을 내고 그 효과를 복제합니다(시장 카드에는 토큰을 놓지 않으며 발전 전용 카드는 선택 불가).</p></article><article><h3>브리지 구조물</h3><p>석조 다리·현수교·고가도로를 활성화하면, 자기 매트의 일꾼 1개를 같은 종류의 비어 있는 메인보드 영역에 추가 배치하고 즉시 그 행동을 합니다. '비어 있음'은 일꾼이 없는 상태이며 토큰·자원은 있어도 됩니다.</p></article><article><h3>새 글로벌 임팩트</h3><p>새 글로벌 임팩트 카드는 기존 후기 임팩트 덱에 섞습니다. 어떤 효과로 마지막 남은 일꾼을 잃게 될 경우, 그 일꾼 상실 효과는 무시합니다.</p></article></section>
<section><h2>종말 시계·냉전</h2><article><h3>종말 시계 준비</h3><p>종말 시계 보드를 메인보드 옆에 놓고 바늘을 1에 맞춥니다. 콜드 워 카드를 섞어 지정된 자리에 뒷면으로 놓습니다. 시계는 메인보드의 한 영역으로 취급합니다.</p></article><article><h3>종말 시계 사용</h3><p>Work 턴에 일반 위치 대신 시계에 일꾼을 놓고 일반 쌓기 규칙과 현재 칸의 추가 비용을 지불합니다. 1) 바늘을 한 칸 전진, 2) 콜드 워 3장 중 1장을 덱 밑에 넣고 2장을 얻어 1장은 공개·1장은 비공개로 둠, 3) 카드 종류 제한 없이 자기 테이블의 카드들을 활성화합니다.</p></article><article><h3>냉전 종료 점수·동점</h3><p>콜드 워 카드 1장마다 1점을 얻습니다. 군사력·우주 경쟁·외교 각각에서 아이콘 수치를 합산해 1등은 현재 시계 숫자, 단독 2등은 그 절반(내림)을 받습니다. 아이콘이 하나도 없으면 해당 보너스를 못 받습니다. 1등 동점이면 모두 절반(내림), 2등 동점이면 보너스가 없습니다. 바늘이 12에 닿으면 종료를 발동합니다.</p></article></section>
<section><h2>Clash of Nations</h2><article><h3>솔로 준비</h3><p>Clash of Nations은 본판 솔로 규칙을 대체합니다. 라이벌 색의 일꾼 6개·에너지 10개와 초기/후기 덱을 준비합니다. 글로벌 임팩트 칸마다 오염 4개, 세 시장 모두 3장, 중립 일꾼 없음으로 준비합니다. 본인과 라이벌 마커를 점수·UN 시작 칸에 둡니다.</p></article><article><h3>라이벌 국가 차례</h3><p>항상 내가 먼저 한 뒤 라이벌이 합니다. 라이벌 일꾼이 남으면 Work: 현재 덱의 카드를 뽑아 위에서부터 지시된 위치에 최소 에너지와 함께 일꾼을 놓고, 시장이면 표시 구조물을 버리고 보충합니다. 일꾼이 없으면 Generate: 카드를 뒷면으로 놓고 그 위에 트랙 오염 1개를 올린 뒤 모든 라이벌 말과 에너지를 회수합니다.</p></article><article><h3>라이벌 특수 규칙·점수</h3><p>라이벌은 자원을 얻거나 잃지 않고, 환경·구조물·업적 점수를 받지 않으며 글로벌 임팩트 효과도 받지 않습니다. 종료 시 사용된 Clash 카드 VP, UN 위치와 리더 보너스, 그리고 종말 시계 사용 시 카드의 군사력·우주·외교 합계로만 점수 냅니다. 내 최종 점수가 더 높아야 승리합니다.</p></article></section></noscript>
