<noscript><section><h2>기본 규칙</h2><article><h3>라운드</h3><p>3라운드 뒤 최종 점수. 매 라운드 1 시장 갱신 → 2 플레이어 차례 → 3 라운드 종료. 1/2/3라운드 시작 때 장인은 7/6/5명입니다.</p></article><article><h3>시장 갱신</h3><p>현재 라운드 수요 타일에 따라 시장 마커를 2/1/0칸 올립니다. 이어서 첫 플레이어가 시장 주사위를 굴려 가장 높은 눈을 2 칸, 다음을 1 칸, 가장 낮은 눈을 0 칸에 배정해 그만큼 올립니다. 2라운드부터 첫 플레이어는 한 번 다시 굴릴 수 있습니다.</p></article><article><h3>라운드 종료</h3><p>모두의 가게 카드가 닫혀 있고 모두 같은 횟수의 차례를 했으면 라운드가 끝납니다. 장인을 모두 돌려받아 1명을 상자에 넣고, 가게 카드를 다시 엽니다.</p></article><article><h3>자원</h3><p>페라 고르다 토큰과 유약은 개인 공급처에 둡니다. 점토는 점토 트랙으로 관리하며 최대 7. 균열은 청소 구역(8칸)에 두며, 자리가 없으면 균열을 얻는 효과를 쓸 수 없습니다. 검은 숫자는 얻기, 빨간 숫자는 내기.</p></article><article><h3>승점</h3><p>즉시 점수는 점수 트랙에서 바로 이동, 종료 점수는 게임 끝에 계산합니다. 한 바퀴마다 +50/+100 토큰을 씁니다. 구성물 수는 제한됩니다.</p></article></section></noscript>
