<noscript><section><h2>기본 규칙</h2><article><h3>라운드 진행</h3><p>6라운드. 매 라운드 1 수입 → 2 가이아 단계 → 3 행동(모두 패스할 때까지 차례마다 행동 1번) → 4 정리.</p></article><article><h3>주 행동</h3><p>1 광산 건설 · 2 가이아 프로젝트 시작 · 3 건물 업그레이드 · 4 연방 결성 · 5 연구 전진(지식 4) · 6 파워·QIC 행동 · 7 특수 행동(주황) · 8 패스(라운드 부스터 교체).</p></article><article><h3>자유 행동</h3><p>내 차례 아무 때나: 파워 4 → QIC 1 · 파워 4 → 지식 1 · 파워 3 → 광석 1 · 파워 1 → 크레딧 1 · QIC 1 → 광석 1 · 광석 1 → 크레딧 1 · 지식 1 → 크레딧 1 · 광석 1 → 파워 토큰 1개(I 영역). 소각: II 영역 토큰 1개를 버리고 다른 1개를 II → III로.</p></article><article><h3>거리와 QIC</h3><p>거리는 내 행성 아무 곳에서나 셉니다(기본 거리는 항법 레벨). 건설할 때 QIC 1개마다 거리 +2.</p></article><article><h3>파워 순환</h3><p>파워 충전은 I → II를 먼저, 다 비면 II → III. 파워는 III 영역에서만 쓰고, 쓴 토큰은 I로 돌아갑니다.</p></article><article><h3>건물</h3><p>광산: 광석 1 + 크레딧 2 (파워 값 1). 교역소: 광석 2 + 크레딧 6, 거리 2 안에 상대 건물이 있으면 크레딧 3 (값 2). 연구소: 광석 3 + 크레딧 5, 기술 타일 획득 (값 2). 행성 의회: 광석 4 + 크레딧 6 (값 3). 아카데미: 광석 6 + 크레딧 6, 기술 타일 획득 (값 3).</p></article><article><h3>테라포밍 순환</h3><p>테라(파랑) → 산화(빨강) → 화산(주황) → 사막(노랑) → 늪(갈색) → 티타늄(회색) → 얼음(흰색) → 다시 테라. 필요한 단계 수(1–3)는 종족 판에 있고, 단계마다 테라포밍 레벨에 따른 광석을 냅니다. 가이아 행성은 QIC 1개, 차원 변형 행성은 먼저 가이아 프로젝트가 필요합니다.</p></article><article><h3>가이아 프로젝트</h3><p>Gaia Project 레벨에 따라 파워 토큰 6/6/4/3/3개를 가이아 영역에 넣고 차원 변형 행성에 가이아 포머를 놓습니다. 다음 가이아 단계에 가이아 행성이 되며, QIC 없이 광산을 지을 수 있습니다.</p></article><article><h3>이웃 파워 충전</h3><p>상대가 내 건물 거리 2 안에 건설하면, 그 범위의 내 건물 중 가장 높은 파워 값만큼 충전할 수 있습니다. 대가로 (값 − 1) 점을 잃습니다. 전부 받거나 안 받거나 둘 중 하나(파워가 꽉 차거나 점수가 모자랄 때만 예외). 패스한 사람도 받을 수 있습니다.</p></article><article><h3>연방</h3><p>파워 값 합이 7 이상인 건물을 위성으로 연결합니다(위성 1개마다 파워 토큰 1개 버림). 원하는 연방 토큰 1개를 받습니다. 건물과 위성은 연방 하나에만 속하며, 새 연방은 기존 연방과 바로 붙어 있을 수 없습니다.</p></article><article><h3>게임 종료</h3><p>6라운드 뒤: 최종 점수 타일 2개(1–3위 18/12/6점, 동점은 나눔), 각 트랙의 레벨 3·4·5마다 4점, 남은 크레딧·광석·지식 합쳐서 3개당 1점. 모두 10점에서 시작합니다.</p></article></section>
<section><h2>종족</h2><article><h3>테란 (Terrans)</h3><p>고향: 테라(파랑). 가이아 단계에 가이아 영역 파워가 I이 아닌 II로 돌아갑니다. 행성 의회: 돌아오는 파워만큼 자유 행동 자원으로 바꿀 수 있습니다.</p></article><article><h3>란티드 (Lantids)</h3><p>고향: 테라(파랑). 상대가 차지한 행성(잃어버린 행성 포함)에도 광산을 지을 수 있습니다(광산 비용만, 업그레이드 불가, 행성 종류 집계 제외). 행성 의회: 그렇게 지을 때마다 지식 2.</p></article><article><h3>제노스 (Xenos)</h3><p>고향: 사막(노랑). 시작 광산 3번째를 마지막에 놓습니다. 행성 의회: 연방 조건이 파워 6, 행성 의회 수입이 파워 대신 QIC 1.</p></article><article><h3>글린 (Gleens)</h3><p>고향: 사막(노랑). 아카데미 전에는 QIC 대신 광석을 받습니다. 가이아 행성은 QIC 대신 광석 1. 가이아 행성 광산마다 +2점. 행성 의회: 글린 전용 연방 토큰 획득.</p></article><article><h3>타클론 (Taklons)</h3><p>고향: 늪(갈색). 브레인스톤: 쓸 때 파워 3으로 치는 토큰 1개. 행성 의회: 이웃 파워 충전 때마다 파워 토큰 1개(충전 전이나 후).</p></article><article><h3>암바스 (Ambas)</h3><p>고향: 늪(갈색). 행성 의회 특수 행동(라운드당 1번): 내 행성 의회와 광산 하나의 위치를 바꿉니다.</p></article><article><h3>하쉬 할라 (Hadsch Hallas)</h3><p>고향: 산화(빨강). 행성 의회: 자원을 얻는 자유 행동에 파워 대신 크레딧을 냅니다.</p></article><article><h3>이비츠 (Ivits)</h3><p>고향: 산화(빨강). 시작 광산 없이 행성 의회를 마지막에 빨간 행성에 놓습니다. 연방은 하나만 키워 나가며, 7 × (연방 토큰 수 + 1) 파워가 필요합니다. 위성은 QIC 1. 행성 의회 행동: 우주 정거장 배치.</p></article><article><h3>지오덴 (Geodens)</h3><p>고향: 화산(주황). 행성 의회: 행성 종류마다 처음 광산을 지을 때 지식 3.</p></article><article><h3>발타크 (Bal T'aks)</h3><p>고향: 화산(주황). 행성 의회 전에는 항법을 올릴 수 없습니다. 자유 행동: 가이아 포머를 가이아 영역에 넣고 QIC 1.</p></article><article><h3>피락 (Firaks)</h3><p>고향: 티타늄(회색). 행성 의회 행동: 연구소를 교역소로 내리고 연구 1단계 전진.</p></article><article><h3>베스코드 (Bescods)</h3><p>고향: 티타늄(회색). 종족 판에서 행성 의회와 아카데미 위치가 바뀝니다(교역소·연구소 수입도 서로 바뀜). 라운드당 1번 행동: 가장 낮은 연구 토큰을 지식 없이 1단계 전진(레벨 5는 연방 토큰 필요). 행성 의회: 회색 행성 위 내 건물의 파워 값 +1.</p></article><article><h3>네블라 (Nevlas)</h3><p>고향: 얼음(흰색). 자유 행동: III 영역 파워 1개를 가이아 영역으로 보내고 지식 1(파워 사용 아님). 행성 의회: III 영역 토큰 1개를 파워 2로 씁니다. 홀수 비용에서 남는 1은 버려집니다.</p></article><article><h3>이타르 (Itars)</h3><p>고향: 얼음(흰색). 소각한 파워가 가이아 영역으로 갑니다. 행성 의회: 가이아 단계에 가이아 영역 파워 4개를 버리고 기술 타일 1개(반복 가능).</p></article></section>
<section><h2>연구 트랙</h2><article><h3>테라포밍 (Terraforming)</h3><p>단계당 광석: 3/3/2/1/1/1 (레벨 0–5). 레벨 1·4: 광석 2. 레벨 5: 그 칸의 연방 토큰 획득.</p></article><article><h3>항법 (Navigation)</h3><p>거리: 1/1/2/2/3/4. 레벨 1·3: QIC 1. 레벨 5: 닿는 빈칸에 잃어버린 행성 배치(광산으로 침).</p></article><article><h3>인공지능 (Artificial Intelligence)</h3><p>레벨 도달 시 QIC: 1/1/2/2/4 (레벨 1–5).</p></article><article><h3>가이아 프로젝트 (Gaia Project)</h3><p>시작 비용 파워: 6/6/4/3/3 (레벨 1–5). 레벨 1·3·4: 가이아 포머 획득. 레벨 2: 파워 토큰 3개. 레벨 5: 4점 + 가이아 행성당 1점.</p></article><article><h3>경제 (Economy)</h3><p>수입: L1 크레딧 2·충전 1 · L2 광석 1·크레딧 2·충전 2 · L3 광석 1·크레딧 3·충전 3 · L4 광석 2·크레딧 4·충전 4 · L5 즉시 광석 3·크레딧 6·충전 6(이후 수입 없음).</p></article><article><h3>과학 (Science)</h3><p>지식 수입 1/2/3/4 (레벨 1–4). 레벨 5: 즉시 지식 9(이후 수입 없음).</p></article><article><h3>연구 규칙 (Research rules)</h3><p>1단계에 지식 4. 레벨 2 → 3에서 파워 3 충전. 레벨 5는 연방 토큰 1개를 회색으로 뒤집어야 하며, 트랙마다 한 명만 도달합니다.</p></article></section>
<section><h2>기본 기술 타일</h2><article><h3>T1 · 광석과 QIC (Ore and QIC)</h3><p>즉시: 광석 1 + QIC 1.</p></article><article><h3>T2 · 행성 종류당 지식 (Knowledge per planet type)</h3><p>즉시: 내가 개척한 행성 종류마다 지식 1.</p></article><article><h3>T3 · 7점 (7 VP)</h3><p>즉시: 7점.</p></article><article><h3>T4 · 광석·파워 수입 (Ore and power income)</h3><p>수입: 광석 1 + 파워 1 충전.</p></article><article><h3>T5 · 지식·크레딧 수입 (Knowledge and credit income)</h3><p>수입: 지식 1 + 크레딧 1.</p></article><article><h3>T6 · 가이아 광산 점수 (Gaia mine VP)</h3><p>지속: 가이아 행성에 광산을 지을 때마다 +3점.</p></article><article><h3>T7 · 크레딧 수입 (Credit income)</h3><p>수입: 크레딧 4.</p></article><article><h3>T8 · 큰 건물 파워 값 4 (Big buildings value 4)</h3><p>지속: 내 행성 의회와 아카데미의 파워 값이 4. 고급 기술 타일로 덮으면 다시 3(이미 만든 연방은 유지).</p></article><article><h3>T9 · 파워 행동 (Power action)</h3><p>행동(라운드당 1번): 파워 4 충전.</p></article></section>
<section><h2>고급 기술 타일</h2><article><h3>패스: 연방 (Pass: federations)</h3><p>패스할 때: 내 연방 토큰마다 3점.</p></article><article><h3>패스: 연구소 (Pass: research labs)</h3><p>패스할 때: 연구소마다 3점.</p></article><article><h3>패스: 행성 종류 (Pass: planet types)</h3><p>패스할 때: 개척한 행성 종류마다 1점.</p></article><article><h3>즉시: 광산 (Mines now)</h3><p>즉시: 광산마다 2점.</p></article><article><h3>즉시: 교역소 (Trading stations now)</h3><p>즉시: 교역소마다 4점.</p></article><article><h3>즉시: 연방 (Federations now)</h3><p>즉시: 연방 토큰마다 5점.</p></article><article><h3>즉시: 섹터 (Sectors now)</h3><p>즉시: 내 건물이 있는 섹터마다 2점.</p></article><article><h3>즉시: 섹터 광석 (Sector ore)</h3><p>즉시: 내 건물이 있는 섹터마다 광석 1.</p></article><article><h3>즉시: 가이아 행성 (Gaia planets now)</h3><p>즉시: 가이아 행성마다 2점.</p></article><article><h3>광산 점수 (Mine VP)</h3><p>지속: 광산을 지을 때마다 +3점.</p></article><article><h3>교역소 점수 (Trading station VP)</h3><p>지속: 교역소를 지을 때마다 +3점.</p></article><article><h3>연구 점수 (Research VP)</h3><p>지속: 연구 단계를 올릴 때마다 +2점.</p></article><article><h3>광석 행동 (Ore action)</h3><p>행동(라운드당 1번): 광석 3.</p></article><article><h3>QIC·크레딧 행동 (QIC and credits action)</h3><p>행동(라운드당 1번): QIC 1 + 크레딧 5.</p></article><article><h3>지식 행동 (Knowledge action)</h3><p>행동(라운드당 1번): 지식 3.</p></article></section>
<section><h2>라운드 부스터</h2><article><h3>1 · 광석 + 지식 (Ore + knowledge)</h3><p>수입: 광석 1 + 지식 1.</p></article><article><h3>2 · 크레딧 + QIC (Credits + QIC)</h3><p>수입: 크레딧 2 + QIC 1.</p></article><article><h3>3 · 파워 토큰 + 광석 (Power tokens + ore)</h3><p>수입: 파워 토큰 2개 + 광석 1.</p></article><article><h3>4 · 테라포밍 행동 (Terraform action)</h3><p>수입: 크레딧 2. 행동: 테라포밍 1단계 무료로 광산 건설.</p></article><article><h3>5 · 거리 행동 (Range action)</h3><p>수입: 파워 2 충전. 행동: 거리 +3으로 광산 건설 또는 가이아 프로젝트 시작.</p></article><article><h3>6 · 패스: 광산 (Pass: mines)</h3><p>수입: 광석 1. 패스할 때: 광산마다 1점.</p></article><article><h3>7 · 패스: 연구소 (Pass: research labs)</h3><p>수입: 지식 1. 패스할 때: 연구소마다 3점.</p></article><article><h3>8 · 패스: 교역소 (Pass: trading stations)</h3><p>수입: 광석 1. 패스할 때: 교역소마다 2점.</p></article><article><h3>9 · 패스: 큰 건물 (Pass: big buildings)</h3><p>수입: 파워 4 충전. 패스할 때: 행성 의회·아카데미마다 4점.</p></article><article><h3>10 · 패스: 가이아 행성 (Pass: Gaia planets)</h3><p>수입: 크레딧 4. 패스할 때: 가이아 행성마다 1점.</p></article></section>
<section><h2>라운드 점수 타일</h2><article><h3>R1 · 광산 (Mine)</h3><p>광산을 지을 때마다 +2점.</p></article><article><h3>R2 · 교역소 (3) (Trading station (3))</h3><p>교역소를 지을 때마다 +3점.</p></article><article><h3>R3 · 교역소 (4) (Trading station (4))</h3><p>교역소를 지을 때마다 +4점.</p></article><article><h3>R4 · 가이아 광산 (3) (Gaia mine (3))</h3><p>가이아 행성에 광산을 지을 때마다 +3점.</p></article><article><h3>R5 · 가이아 광산 (4) (Gaia mine (4))</h3><p>가이아 행성에 광산을 지을 때마다 +4점.</p></article><article><h3>R6 · 큰 건물 (Big building)</h3><p>행성 의회·아카데미를 지을 때마다 +5점 (2장).</p></article><article><h3>R7 · 연방 (Federation)</h3><p>연방 토큰을 얻을 때마다 +5점.</p></article><article><h3>R8 · 연구 (Research)</h3><p>연구 단계를 올릴 때마다 +2점.</p></article><article><h3>R9 · 테라포밍 (Terraforming)</h3><p>테라포밍 1단계마다 +2점.</p></article></section>
<section><h2>최종 점수 타일</h2><article><h3>연방 안 건물 (Buildings in federations)</h3><p>연방에 속한 건물 수(잃어버린 행성 포함).</p></article><article><h3>건물 수 (Buildings)</h3><p>지도 위 건물 수(잃어버린 행성 포함).</p></article><article><h3>행성 종류 (Planet types)</h3><p>개척한 행성 종류 수(가이아·잃어버린 행성 포함).</p></article><article><h3>가이아 행성 (Gaia planets)</h3><p>개척한 가이아 행성 수.</p></article><article><h3>섹터 (Sectors)</h3><p>내 건물이 있는 섹터 수.</p></article><article><h3>위성 (Satellites)</h3><p>위성 수(이비츠 우주 정거장 포함).</p></article></section>
<section><h2>연방 토큰</h2><article><h3>×3 · 12점 (12 VP)</h3><p>12점. 양면이 회색이라 레벨 5·고급 기술에 뒤집어 쓸 수 없습니다.</p></article><article><h3>×3 · 8점 + QIC (8 VP + QIC)</h3><p>8점 + QIC 1.</p></article><article><h3>×3 · 8점 + 파워 토큰 (8 VP + power tokens)</h3><p>8점 + 파워 토큰 2개.</p></article><article><h3>×3 · 7점 + 광석 (7 VP + ore)</h3><p>7점 + 광석 2.</p></article><article><h3>×3 · 7점 + 크레딧 (7 VP + credits)</h3><p>7점 + 크레딧 6.</p></article><article><h3>×3 · 6점 + 지식 (6 VP + knowledge)</h3><p>6점 + 지식 2.</p></article><article><h3>×1 · 글린 전용 (Gleens token)</h3><p>글린 전용(행성 의회 보상): 광석 1 + 지식 1 + 크레딧 2.</p></article></section>
<section><h2>파워·QIC 행동</h2><article><h3>7 PW · 지식 (Knowledge)</h3><p>파워 7: 지식 3.</p></article><article><h3>5 PW · 테라포밍 2단계 (2 terraforming steps)</h3><p>파워 5: 테라포밍 2단계 무료로 광산 건설.</p></article><article><h3>4 PW · 광석 (Ore)</h3><p>파워 4: 광석 2.</p></article><article><h3>4 PW · 크레딧 (Credits)</h3><p>파워 4: 크레딧 7.</p></article><article><h3>4 PW · 지식 (2) (Knowledge (2))</h3><p>파워 4: 지식 2.</p></article><article><h3>3 PW · 테라포밍 1단계 (1 terraforming step)</h3><p>파워 3: 테라포밍 1단계 무료로 광산 건설.</p></article><article><h3>3 PW · 파워 토큰 (Power tokens)</h3><p>파워 3: 파워 토큰 2개.</p></article><article><h3>4 QIC · 기술 타일 (Tech tile)</h3><p>QIC 4: 기본 기술 타일 1개.</p></article><article><h3>3 QIC · 연방 다시 받기 (Federation again)</h3><p>QIC 3: 내 연방 토큰 하나의 보상을 다시 받습니다.</p></article><article><h3>2 QIC · 행성 종류 점수 (Planet types VP)</h3><p>QIC 2: 3점 + 개척한 행성 종류마다 1점.</p></article></section></noscript>
