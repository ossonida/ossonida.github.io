<noscript><section><h2>사제·여사제</h2><article><h3>01 · 케찰코아틀</h3><p>발음: keh-tsahl-KOH-ah-tl. 가면 발견 타일을 얻은 직후 자원 1개(나무·돌·금)와 원하는 사원 전진 1회를 얻습니다. 비가면 발견 타일은 얻을 수 없습니다.</p></article><article><h3>02 · 틀랄로크</h3><p>발음: TLAH-lock. 숲·채석장·금광의 주 행동 때 다른 플레이어의 잠기지 않은 일꾼 1개를 내 일꾼처럼 셀 수 있습니다. 건물 또는 피라미드 타일을 놓을 때 자원을 1개 더 냅니다.</p></article><article><h3>03 · 찰치우틀리쿠에</h3><p>발음: chahl-cheew-TLEEK-weh. 어느 행동판이든 주 행동 비용은 항상 카카오 1개입니다. 제약은 없습니다.</p></article><article><h3>04 · 오쇼모코</h3><p>발음: oh-shoh-MOH-koh. 귀족/정복 또는 장식/건축의 주 행동을 할 때 해당 행동판에 일꾼이 1개 더 있는 것처럼 모든 수치를 계산합니다. 제약은 없습니다.</p></article><article><h3>05 · 시페 토테크</h3><p>발음: SHEE-peh TOH-teck. 숭배 시 다른 플레이어의 일꾼을 잠금 해제하거나, 카카오 없이 두 선택지(공간 능력·발견 타일)를 모두 해결할 수 있습니다. 내 잠긴 일꾼 전체를 카카오로 풀 때 일꾼당 2카카오(최대 5)를 냅니다.</p></article><article><h3>06 · 숄로틀</h3><p>발음: SHOH-loh-tl. 승천을 해결할 때 승천 보상을 2개(같거나 달라도 됨) 고릅니다. 사원 한 칸 전진 전 카카오 1개 또는 승점 3점을 먼저 내야 하며, 못 내거나 원하지 않으면 그 전진은 포기합니다.</p></article><article><h3>07 · 에에카틀</h3><p>발음: Eh-HEH-kah-tl. 일반 턴에 1~4 행동판 이동, 또는 카카오 3개로 아무 행동판으로 이동할 수 있습니다. 카카오 수집은 1개 적게 받고, 카카오를 내서 내 잠긴 일꾼 전체를 푸는 선택은 할 수 없습니다.</p></article><article><h3>08 · 토나카시우아틀</h3><p>발음: toh-nah-kah-SEE-wah-tl. 시작 시 시작 카드 2장을 따로 보관하고, 첫·두 번째 일식 뒤에 각각 한 장의 혜택을 받습니다. 귀족/정복·장식/건축·건설/개발의 주 행동에는 나무를 1개 더 냅니다.</p></article><article><h3>09 · 위칠로포츠틀리</h3><p>발음: wee-tsee-loh-POHCH-tlee. 승점을 1점 이상 얻을 때마다 승점을 1점 더 얻습니다. 일식 급여 계산 시 일꾼마다 카카오 1개를 추가합니다.</p></article><article><h3>10 · 쇼치필리</h3><p>발음: shoh-chee-PEEL-lee. 기술을 얻을 때 금을 1개 덜 내며, 연금술에 일꾼 1개만 있어도 아무 기술이나 연구할 수 있습니다. 숭배할 수 없고, 사원의 주요 칸에서 발견 타일을 얻을 수 없습니다.</p></article><article><h3>11 · 코아틀리쿠에</h3><p>발음: koh-wah-TLEE-kweh. 시작 시 무작위 기술 2개 중 1개를 무료로 얻고 다른 하나는 버립니다. 흑요석을 나무·돌·금의 와일드 자원으로 쓸 수 없습니다(흑요석을 명시한 비용은 낼 수 있음).</p></article><article><h3>12 · 시우테쿠틀리</h3><p>발음: sheew-teh-COOH-tlee. 카카오 수집·왕실 타일 숭배 전, 또는 가면 발견 타일 획득 후 샤먼을 세웁니다. 일식 급여에 샤먼이 서 있으면 2카카오, 누워 있으면 4카카오를 더합니다.</p></article><article><h3>13 · 위츠틀람파에에카틀</h3><p>발음: weets-tlahm-pah-eh-HEH-kah-tl. 내 턴 시작에 위력이 1인 일꾼 하나를 강화할 수 있습니다. 시작 시 네 번째 일꾼을 게임에서 빼며, 이후에도 얻을 수 없습니다.</p></article></section>
<section><h2>발견 타일</h2><article><h3>D01 · 카카오 면제</h3><p>어떤 이유로든 카카오를 내야 할 때 한 번, 그 카카오 비용 전체를 무시합니다. 일식 급여·주 행동·숭배·일부 타일 비용에 쓸 수 있습니다.</p></article><article><h3>D02 · 자원 2개</h3><p>나무·돌·금 중 원하는 조합으로 2개를 얻습니다.</p></article><article><h3>D03 · 자원 3개</h3><p>비용으로 나무 1개를 내고, 나무·돌·금 중 원하는 조합으로 3개를 얻습니다.</p></article><article><h3>D04 · 카카오 4개</h3><p>비용으로 금 1개를 내고 카카오 4개를 얻습니다.</p></article><article><h3>D05 · 파랑 사원 전진</h3><p>파랑 사원에서 1칸 전진합니다.</p></article><article><h3>D06 · 빨강 사원 전진</h3><p>빨강 사원에서 1칸 전진합니다.</p></article><article><h3>D07 · 초록 사원 전진</h3><p>초록 사원에서 1칸 전진합니다.</p></article><article><h3>D08 · 원하는 사원 전진</h3><p>카카오 1개를 내고 원하는 사원에서 1칸 전진합니다.</p></article><article><h3>D09 · 망자의 거리 전진</h3><p>카카오 1개를 내고 망자의 거리에서 1칸 전진합니다.</p></article><article><h3>D10 · 두 번 강화</h3><p>카카오 1개를 내고, 게임판 어디에서든 잠기지 않은 일꾼 하나를 두 번 강화합니다.</p></article><article><h3>D11 · 일꾼 2개 함께 이동</h3><p>일반 이동 대신 같은 행동판의 일꾼 2개를 함께 다른 행동판으로 이동합니다. 카카오 수집·숭배·주 행동은 원본 표의 특수 규칙을 따릅니다.</p></article><article><h3>D12 · 원하는 행동판으로 이동</h3><p>일반 이동 대신 일꾼 하나를 원하는 행동판으로 바로 이동합니다. 지나가는 행동판은 계산하지 않으며, 떠난 곳으로 돌아올 수도 있습니다.</p></article><article><h3>D13 · 가상 일꾼</h3><p>연금술·귀족/정복·건설/개발의 주 행동 때 해당 행동판에 일꾼이 1개 더 있는 것처럼 모든 수치를 계산합니다.</p></article><article><h3>D14 · 가면 발견 타일</h3><p>가면은 뒷면으로 뒤집지 않고 플레이어 영역에 두며, 매 일식에 서로 다른 가면의 세트를 점수 냅니다. 1/2/3/4/5/6/7개 세트는 1/3/6/10/15/21/28점입니다.</p></article></section>
<section><h2>주요 발견 타일</h2><article><h3>MD01 · 흑요석 3개</h3><p>흑요석 3개를 얻습니다.</p></article><article><h3>MD02 · 두 사원 전진</h3><p>카카오 1개를 내고, 원하는 사원 1곳과 표시된 사원 1곳에서 각각 1칸 전진합니다. 순서는 자유입니다.</p></article><article><h3>MD03 · 세 번 강화</h3><p>흑요석 1개를 내고 잠기지 않은 일꾼 하나를 세 번 강화합니다.</p></article><article><h3>MD04 · 어느 행동판이든 가상 일꾼</h3><p>어느 행동판의 주 행동이든 일꾼이 1개 더 있는 것처럼 모든 수치를 계산합니다.</p></article><article><h3>MD05 · 채집 자원 2배</h3><p>숲·채석장·금광의 주 행동 때 얻는 나무·돌·금·흑요석 양을 두 배로 합니다.</p></article><article><h3>MD06 · 뒤로 이동</h3><p>잠기지 않은 일꾼 하나를 행동 없이 반시계 방향으로 1~3칸 뒤로 이동합니다.</p></article><article><h3>MD07 · 발견 타일 재사용</h3><p>흑요석 1개를 내고 사용한 발견 타일 최대 2개를 다시 앞면으로 뒤집어 재사용할 수 있게 합니다. 비용은 다시 내지 않습니다.</p></article><article><h3>MD08 · 최저 번호 기술</h3><p>흑요석 1개를 내고 아직 없는 기술 중 참조 번호가 가장 낮은 기술을 무료로 얻습니다.</p></article><article><h3>MD09 · 샤먼 세우기·카카오 2개</h3><p>일꾼 하나의 위력을 1 낮추는 비용을 내고 샤먼을 세우며 카카오 2개를 얻습니다.</p></article><article><h3>MD10 · 샤먼 두 칸 이동</h3><p>샤먼 활성화 시 다음 제단 대신 반시계 방향으로 두 칸 떨어진 제단으로 이동합니다.</p></article><article><h3>MD11 · 새 가면</h3><p>새 가면 1개를 얻습니다.</p></article></section>
<section><h2>주황 사원 능력</h2><article><h3>OT01 · 발견 보조 자원</h3><p>발견 타일을 얻기 직전 또는 직후 나무·돌·금 중 1개를 얻습니다. 이 자원은 해당 타일 비용에도 쓸 수 있습니다.</p></article><article><h3>OT02 · 승천 위력 2</h3><p>승천 때 새 일꾼의 위력을 1이 아닌 2로 초기화합니다.</p></article><article><h3>OT03 · 망자의 거리 +2</h3><p>일식 때 망자의 거리 위치를 실제보다 2칸 높은 것으로 계산합니다.</p></article><article><h3>OT04 · 일꾼 급여 면제</h3><p>일식 때 일꾼 급여를 내지 않습니다.</p></article><article><h3>OT05 · 가면 1개 추가</h3><p>일식 때 가장 좋은 가면 세트를 가면이 1개 더 있는 것으로 점수 냅니다.</p></article></section>
<section><h2>왕실 타일</h2><article><h3>C00 · 피라미드 건설</h3><p>위력 1~3이면 피라미드 타일 1개, 4~5면 선택으로 1개를 더 놓습니다. 일반 비용·배치·점수·사원 전진 규칙을 따릅니다.</p></article><article><h3>C01 · 카카오</h3><p>잠긴 일꾼의 위력 +1만큼 카카오를 얻습니다.</p></article><article><h3>B02 · 나무·돌 교환</h3><p>카카오 1개를 내고 나무 1개와 돌 1개를 얻습니다. 최소 한 번, 일꾼 위력만큼까지 반복합니다.</p></article><article><h3>C03 · 자원→카카오</h3><p>나무·돌·금 중 1개를 내고 카카오 2개를 얻습니다. 최소 한 번, 일꾼 위력만큼까지 반복합니다.</p></article><article><h3>A04 · 기술 점수</h3><p>내 기술 수와 잠긴 일꾼 위력 중 낮은 수마다 2점을 얻습니다.</p></article><article><h3>A05 · 피라미드 트랙 점수</h3><p>피라미드 트랙 위치와 잠긴 일꾼 위력 중 낮은 수마다 2점을 얻습니다.</p></article><article><h3>B06 · 돌·금 교환</h3><p>카카오 1개를 내고 돌 1개와 금 1개를 얻습니다. 최소 한 번, 일꾼 위력만큼까지 반복합니다.</p></article><article><h3>B07 · 자원 묶음</h3><p>카카오 1개와 자원 1개를 내고, 일꾼 위력만큼 나무·돌·금을 원하는 조합으로 한 번 얻습니다.</p></article><article><h3>C08 · 사원 전진</h3><p>카카오 1개를 내고 원하는 사원에서 1칸 전진합니다. 최대 일꾼 위력 -1회까지 반복합니다.</p></article><article><h3>A09 · 망자의 거리 점수</h3><p>망자의 거리 위치와 잠긴 일꾼 위력+1 중 낮은 수마다 1점을 얻습니다.</p></article><article><h3>A10 · 주요 발견 타일 쌍 점수</h3><p>주요 발견 타일 쌍 수와 잠긴 일꾼 위력 중 낮은 수마다 2점을 얻습니다. 주요 발견 타일을 쓰는 모듈이 없으면 빼고 준비합니다.</p></article><article><h3>A11 · 잠긴 일꾼 점수</h3><p>이 일꾼을 포함한 내 잠긴 일꾼 수와 그 위력 중 낮은 수마다 2점을 얻습니다.</p></article><article><h3>B13 · 카카오→흑요석</h3><p>카카오 3개를 내고 일꾼 위력만큼 흑요석을 한 번 얻습니다. 흑요석 모듈이 없으면 빼고 준비합니다.</p></article><article><h3>C12 · 흑요석→카카오·점수</h3><p>흑요석 1개를 내고 카카오 1개와 2점을 얻습니다. 최소 한 번, 일꾼 위력만큼까지 반복합니다.</p></article></section>
<section><h2>사원 보너스</h2><article><h3>1 · 사원 보너스 수</h3><p>도달한 사원 보너스 하나당 9점을 얻습니다. 이 타일도 포함합니다.</p></article><article><h3>2 · 기술 수</h3><p>얻은 기술 하나당 5점을 얻습니다. 코아틀리쿠에의 추가 기술은 세지 않습니다.</p></article><article><h3>3 · 고정 점수</h3><p>15점을 얻습니다.</p></article><article><h3>4 · 망자의 거리</h3><p>망자의 거리에서 전진한 칸마다 3점을 얻습니다.</p></article><article><h3>5 · 가면 세트 재점수</h3><p>가장 좋은 가면 세트를 한 번 더 점수 냅니다.</p></article><article><h3>6 · 비가면 발견 타일</h3><p>앞면·뒷면 모두 포함해, 가진 비가면 발견 타일 하나당 2점을 얻습니다.</p></article><article><h3>7 · 일꾼 위력</h3><p>위력 1~3의 일꾼마다 4점, 위력 4~5의 일꾼마다 9점을 얻습니다.</p></article></section>
<section><h2>계절 카드</h2><article><h3>S01 · 급여 완화</h3><p>다음 일식의 급여에서 위력 4도 카카오 1개만 냅니다. 위력 1~4는 1개, 5는 2개입니다.</p></article><article><h3>S02 · 망자의 거리 점수</h3><p>망자의 거리에서 전진할 때마다 즉시 2점을 얻습니다.</p></article><article><h3>S03 · 자유 배치 승천</h3><p>승천으로 새로 생긴 일꾼을 원하는 행동판에 놓을 수 있습니다.</p></article><article><h3>S04 · 내 일꾼 무시</h3><p>카카오 수집 또는 주 행동 전 카카오를 낼 때, 내 색 일꾼은 행동판의 일꾼 수에 세지 않습니다.</p></article><article><h3>S05 · 추가 사원 전진</h3><p>사원(주황 포함)에서 전진한 직후 카카오 2개를 내고 다른 사원에서 1칸 전진할 수 있습니다. 추가 전진은 연쇄하지 않습니다.</p></article><article><h3>S06 · 피라미드 트랙 강화</h3><p>다음 일식의 피라미드 트랙 칸은 1/2/3번째 일식에 각각 5/4/3점입니다.</p></article><article><h3>S07 · 이동 거리 증가</h3><p>일반 이동이 1~3칸 대신 2~4칸이 됩니다. 에에카틀·기술 04와 조합하면 원본 표의 추가 범위를 적용합니다.</p></article><article><h3>S08 · 특수 효과 없음</h3><p>이 계절에는 별도 규칙이 적용되지 않습니다.</p></article><article><h3>S09 · 샤먼 두 칸 이동</h3><p>샤먼 활성화 시 다음 제단이 아니라 반시계 방향으로 두 칸 떨어진 제단으로 이동할 수 있습니다.</p></article></section>
<section><h2>기술 타일</h2><article><h3>00 · 자원 변환</h3><p>일반 이동으로 궁전/저택(1)을 지나거나 도착한 직후, 한 종류의 나무·돌·금 최대 4개를 같은 수의 다른 한 종류로 바꿀 수 있습니다.</p></article><article><h3>01 · 궁전 통과 카카오</h3><p>일반 이동으로 궁전/저택(1)을 지나거나 도착한 직후 카카오 1개를 얻습니다.</p></article><article><h3>1½ · 와일드 흑요석</h3><p>‘원하는 자원’을 얻을 때 흑요석을 선택할 수 있습니다. 흑요석 모듈이 없으면 빼고 준비합니다.</p></article><article><h3>02 · 카카오 수집 +1</h3><p>일반 턴에 카카오를 수집하면 카카오 1개를 더 얻습니다.</p></article><article><h3>03 · 연금술·귀족 점수</h3><p>연금술(5) 또는 귀족/정복(6)의 주 행동 뒤 턴 끝에 3점을 얻습니다.</p></article><article><h3>3½ · 카카오 대체 흑요석</h3><p>카카오 비용을 낼 때 흑요석 1개로 카카오 최대 3개를 대신 낼 수 있습니다. 초과분은 잃습니다.</p></article><article><h3>04 · 이동 +1</h3><p>일반 턴에 일꾼을 1~4 행동판 이동합니다. 다른 이동 효과와 조합한 범위는 원본 규칙을 따릅니다.</p></article><article><h3>05 · 채집 보너스 자원</h3><p>숲·채석장·금광 주 행동 때 각각 나무·돌·금 1개를 추가로 얻습니다.</p></article><article><h3>5½ · 카카오 행동 흑요석</h3><p>궁전/저택에서 숭배하거나 어느 행동판에서 카카오를 수집하면 흑요석 1개를 얻습니다.</p></article><article><h3>06 · 잠금 해제 점수</h3><p>턴 끝에 어떤 방법으로든 내 일꾼을 1개 이상 잠금 해제했다면 4점을 얻습니다.</p></article><article><h3>07 · 채집 카카오·점수</h3><p>숲·채석장·금광 주 행동 때 카카오 1개와 1점을 추가로 얻습니다.</p></article><article><h3>08 · 가면 점수</h3><p>턴 끝에 가면 발견 타일을 얻었다면 2점을 얻습니다.</p></article><article><h3>09 · 장식 점수</h3><p>장식/건축(7)의 주 행동 뒤 턴 끝에 4점을 얻습니다.</p></article><article><h3>10 · 일식 급여 투자</h3><p>일식의 급여 단계 뒤 일꾼마다 카카오 1개를 추가로 내면, 일꾼마다 2점을 얻습니다. 전부 내거나 포기해야 합니다.</p></article><article><h3>11 · 건설 점수</h3><p>건설/개발(8)의 주 행동 뒤 턴 끝에 3점을 얻습니다.</p></article><article><h3>12 · 장식 피라미드 트랙</h3><p>장식/건축 주 행동에서 장식 타일을 1개 이상 놓았다면 턴 끝에 피라미드 트랙에서 1칸 전진합니다.</p></article><article><h3>13 · 추가 강화</h3><p>주 행동과 그 강화들을 해결한 뒤 카카오 정확히 1개를 내고 같은 행동판에서 강화 1회를 더 할 수 있습니다.</p></article><article><h3>14 · 전체 잠금 해제 사원 전진</h3><p>카카오를 내거나 일반 턴을 포기해 내 잠긴 일꾼을 모두 풀면 원하는 사원에서 1칸 전진합니다.</p></article><article><h3>15 · 개발 가상 일꾼·할인</h3><p>건설/개발 주 행동 때 일꾼이 1개 더 있는 것으로 계산하고, 나무 또는 돌 총 1개를 할인받습니다.</p></article><article><h3>16 · 장식 화살표 무시</h3><p>장식/건축 주 행동으로 장식 타일을 놓을 때 화살표 방향을 무시할 수 있습니다.</p></article><article><h3>17 · 건설 뒤 사원 전진</h3><p>건설/개발 주 행동 뒤 턴 끝에 원하는 사원에서 1칸 전진합니다.</p></article><article><h3>18 · 건물 뒤 사원 전진</h3><p>귀족/정복 주 행동으로 건물을 1개 이상 놓았다면 턴 끝에 원하는 사원에서 1칸 전진합니다.</p></article><article><h3>20 · 후진 후 다른 일꾼 행동</h3><p>일반 턴 전 잠기지 않은 일꾼 하나를 반시계 방향으로 정확히 1칸 후진시킨 뒤, 다른 잠기지 않은 일꾼을 이동해 정상적으로 행동합니다.</p></article></section>
<section><h2>모듈 한눈에 보기</h2><article><h3>M1 · 사제와 여사제</h3><p>신을 섬기는 사제·여사제에 따라 비대칭 지속 능력과 제약을 적용합니다.</p></article><article><h3>M2 · 발전의 높이</h3><p>네 번째 주황 사원을 추가합니다. 전진 기회는 적지만 영구 능력을 고릅니다.</p></article><article><h3>M3 · 발전의 계절</h3><p>각 계절마다 공개되는 카드가 다음 일식까지 모든 플레이어에게 새로운 규칙을 적용합니다.</p></article><article><h3>M4 · 건축</h3><p>피라미드 장식을 새로운 방식으로 다루는 건축(7) 행동판을 사용합니다.</p></article><article><h3>M5 · 개발</h3><p>피라미드 타일 건설 방식과 일꾼 운용 시점을 바꾸는 개발(8) 행동판을 사용합니다.</p></article><article><h3>M6 · 흑요석</h3><p>다른 모듈의 특별 행동을 강화하고 진행을 빠르게 하는 새로운 와일드 자원입니다.</p></article><article><h3>M7 · 저택</h3><p>궁전(1) 행동판을 대체하고 강력한 숭배·사원 전진 선택지를 제공합니다.</p></article><article><h3>M8 · 제단과 샤먼</h3><p>행동판 사이의 제단에서 샤먼이 별도 행동을 하고 인접한 주 행동을 강화합니다.</p></article><article><h3>M9 · 제국의 확장</h3><p>전사를 이용해 먼 지역에 정착하고 보상을 얻는 제국 보드를 추가합니다.</p></article></section></noscript>
