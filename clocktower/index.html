<noscript><section><h2>점철되는 혼란</h2><article><h3>요리사</h3><p>주민 · 게임 시작 시, 서로 이웃하게 앉은 악한 플레이어 몇 쌍 있는지 알게 됩니다.</p></article><article><h3>초공감자</h3><p>주민 · 매일 밤, 이웃 생존자 2명 중 몇 명이나 악한지를 알게 됩니다.</p></article><article><h3>점쟁이</h3><p>주민 · 매일 밤, 플레이어 2명을 선택합니다: 그중 악마가 있는지 알게 됩니다. 단, 선한 플레이어 중 1명이 당신에게는 악마로 위장되어 보입니다.</p></article><article><h3>수사관</h3><p>주민 · 게임 시작 시, 플레이어 2명 중 1명이 특정 하수인임을 알게 됩니다.</p></article><article><h3>사서</h3><p>주민 · 게임 시작 시, 플레이어 2명 중 1명이 특정 이방인임을 (또는 게임에 참여하는 이방인이 없음을) 알게 됩니다.</p></article><article><h3>시장</h3><p>주민 · 3명만 생존한 상황에서 처형이 일어나지 않았다면, 당신이 속한 팀이 승리합니다. 밤에 사망하면, 그 대신 다른 플레이어 1명이 사망할 수도 있습니다.</p></article><article><h3>수도사</h3><p>주민 · 매일 밤*, (당신을 제외하고) 플레이어 1명을 선택합니다: 그는 오늘 밤 악마로부터 안전합니다.</p></article><article><h3>까마귀지기</h3><p>주민 · 밤에 사망하면, 깨어나서 플레이어 1명을 선택합니다: 그의 캐릭터를 알게 됩니다.</p></article><article><h3>처단자</h3><p>주민 · 게임당 1번, 낮 동안, 공개적으로 플레이어 1명을 선택합니다: 그가 악마면 그는 사망합니다.</p></article><article><h3>군인</h3><p>주민 · 악마로부터 안전합니다.</p></article><article><h3>장의사</h3><p>주민 · 매일 밤*, 오늘 낮에 처형으로 사망한 플레이어의 캐릭터를 알게 됩니다.</p></article><article><h3>성결자</h3><p>주민 · 처음으로 지목당했을 때, 당신을 지목한 플레이어가 주민이라면, 그는 즉시 처형당합니다.</p></article><article><h3>세탁부</h3><p>주민 · 게임 시작 시, 플레이어 2명 중 1명이 특정 주민임을 알게 됩니다.</p></article><article><h3>집사</h3><p>이방인 · 매일 밤, (당신을 제외하고) 플레이어 1명을 선택합니다: 다음 날, 그가 투표에 참여한 경우에만 당신도 투표에 참여할 수 있습니다.</p></article><article><h3>주정뱅이</h3><p>이방인 · 당신은 자신이 주정뱅이라는 사실을 모릅니다. 대신 다른 주민 캐릭터라고 착각하지만, 사실은 주정뱅이입니다.</p></article><article><h3>은둔자</h3><p>이방인 · 당신은 악한 팀 소속의 하수인 또는 악마로 위장될 수도 있습니다(사망한 상태더라도).</p></article><article><h3>성자</h3><p>이방인 · 당신이 처형으로 사망하면, 당신이 속한 팀이 패배합니다.</p></article><article><h3>남작</h3><p>하수인 · 이방인이 추가로 게임에 참여합니다. [이방인 +2명]</p></article><article><h3>독살범</h3><p>하수인 · 매일 밤, 플레이어 1명을 선택합니다: 그는 황혼까지 중독됩니다.</p></article><article><h3>탕녀</h3><p>하수인 · 플레이어가 5명 이상(여행자는 세지 않음) 생존해 있는 상황에서 악마가 사망하면, 당신이 악마가 됩니다.</p></article><article><h3>첩자</h3><p>하수인 · 매일 밤, 마도서를 확인해 봅니다. 당신은 선한 팀 소속의 특정 주민 또는 이방인으로 위장될 수도 있습니다(사망한 상태더라도).</p></article><article><h3>임프</h3><p>악마 · 매일 밤*, 플레이어 1명을 선택합니다: 그는 사망합니다. 이 방법으로 자결하면, 하수인 1명이 임프가 됩니다.</p></article></section>
<section><h2>피로 물든 달</h2><article><h3>객실 청소부</h3><p>주민 · 매일 밤, (당신을 제외하고) 생존한 플레이어 2명을 선택합니다: 그중 몇 명이 오늘 밤 자기 능력으로 인해 자신이 깨어났는지 알게 됩니다.</p></article><article><h3>궁정대신</h3><p>주민 · 게임당 1번, 밤에, 캐릭터 1명을 선택합니다: 그 플레이어는 3일 밤낮 동안 취합니다.</p></article><article><h3>구마사제</h3><p>주민 · 매일 밤*, (지난밤에 선택하지 않았던) 플레이어 1명을 선택합니다: 악마가 선택된다면 그 악마는 당신의 정체를 알게 되지만 오늘 밤 깨지 않습니다.</p></article><article><h3>어릿광대</h3><p>주민 · 처음으로 사망할 때, 사망하지 않습니다.</p></article><article><h3>도박사</h3><p>주민 · 매일 밤*, 플레이어 1명을 선택하고 그의 캐릭터를 추측합니다: 추측이 틀리면, 당신은 사망합니다.</p></article><article><h3>험담꾼</h3><p>주민 · 매일 낮, 당신은 공개 발언을 할 수 있습니다. 오늘 밤, 그 발언이 사실이었다면 플레이어 1명이 사망합니다.</p></article><article><h3>할머니</h3><p>주민 · 게임 시작 시, 선한 플레이어 1명과 그의 캐릭터를 알게 됩니다. 악마가 그 플레이어를 죽이면, 당신도 사망합니다.</p></article><article><h3>여관 주인</h3><p>주민 · 매일 밤*, 플레이어 2명을 선택합니다: 이들은 오늘 밤 사망할 수 없으나, 그중 1명은 황혼까지 취합니다.</p></article><article><h3>음유시인</h3><p>주민 · 하수인 1명이 처형으로 사망하면, (여행자를 제외하고) 다른 모든 플레이어는 다음 날 황혼까지 취합니다.</p></article><article><h3>평화주의자</h3><p>주민 · 처형당한 선한 플레이어는 사망하지 않을 수도 있습니다.</p></article><article><h3>교수</h3><p>주민 · 게임당 1번, 밤*에, 사망한 플레이어 1명을 선택합니다: 그 플레이어가 주민이라면, 그 플레이어는 부활합니다.</p></article><article><h3>선원</h3><p>주민 · 매일 밤, 생존한 플레이어 1명을 선택합니다: 당신과 그중 1명은 황혼까지 취합니다. 당신은 사망할 수 없습니다.</p></article><article><h3>찻집 여인</h3><p>주민 · 이웃 생존자 2명이 모두 선한 플레이어라면, 이들은 사망할 수 없습니다.</p></article><article><h3>건달</h3><p>이방인 · 매일 밤, 자기 능력으로 당신을 선택하는 첫 플레이어는 황혼까지 취합니다. 당신은 그 플레이어가 소속한 팀이 됩니다.</p></article><article><h3>미치광이</h3><p>이방인 · 당신은 악마가 아니지만, 악마라고 착각합니다. 악마는 당신이 누구인지 알고, 밤에 당신이 누구를 선택하는지 알게 됩니다.</p></article><article><h3>달의 자손</h3><p>이방인 · 당신이 사망했음을 알게 될 때, 생존한 플레이어 1명을 공개적으로 선택합니다. 그가 선한 플레이어라면, 오늘 밤 그는 사망합니다.</p></article><article><h3>땜장이</h3><p>이방인 · 당신은 언제든지 돌연 사망할 수도 있습니다.</p></article><article><h3>암살자</h3><p>하수인 · 게임당 1번, 밤*에, 플레이어 1명을 선택합니다: 그는 이유불문 사망합니다.</p></article><article><h3>악마의 변호사</h3><p>하수인 · 매일 밤, (지난밤에 선택하지 않았던) 생존한 플레이어 1명을 선택합니다: 그 플레이어가 내일 처형당하면, 그는 사망하지 않습니다.</p></article><article><h3>대부</h3><p>하수인 · 게임 시작 시, 어느 이방인이 게임에 참여하는지 알게 됩니다. 낮에 이방인이 1명 사망하면, 그날 밤에 플레이어 1명을 선택합니다: 그는 사망합니다. [이방인 -1명 또는 +1명]</p></article><article><h3>주모자</h3><p>하수인 · 악마가 처형으로 사망하면(게임 종료 조건), 하루 더 게임을 진행합니다. 그런 다음, 플레이어 1명이 처형당하면, 그 플레이어가 소속된 팀이 패배합니다.</p></article><article><h3>포</h3><p>악마 · 매일 밤*, 플레이어 1명을 선택할 수 있습니다: 그는 사망합니다. 이전에 누구도 선택하지 않았다면, 오늘 밤에는 사망할 플레이어 3명을 선택합니다.</p></article><article><h3>푸카</h3><p>악마 · 매일 밤, 플레이어 1명을 선택합니다: 그는 중독됩니다. 이전에 당신이 중독시켰던 플레이어는 사망하고, 건강한 상태가 됩니다.</p></article><article><h3>샤발로스</h3><p>악마 · 매일 밤*, 플레이어 2명을 선택합니다: 그는 사망합니다. 지난 밤에 당신이 선택했던 사망한 플레이어를 다시 토해낼 수도 있습니다.</p></article><article><h3>좀버얼</h3><p>악마 · 매일 밤*, 오늘 낮에 누구도 사망하지 않았다면, 플레이어 1명을 선택합니다: 그는 사망합니다. 당신이 처음으로 사망할 때, 실제로는 생존해 있지만 사망한 상태로 위장합니다.</p></article></section>
<section><h2>화단에 꽃피운 이단</h2><article><h3>화가</h3><p>주민 · 게임당 1번, 낮 동안, 개인적으로 이야기꾼에게 예/아니오로 답할 수 있는 질문을 합니다.</p></article><article><h3>시계공</h3><p>주민 · 게임 시작 시, 악마와 가장 가까운 하수인 사이의 거리를 알게 됩니다.</p></article><article><h3>꿈꾸는 자</h3><p>주민 · 매일 밤, (당신과 여행자를 제외하고) 플레이어 1명을 선택합니다: 선한 캐릭터 하나와 악한 캐릭터 하나를 알게 됩니다. 둘 중 하나가 그의 정체입니다.</p></article><article><h3>꽃팔이 소녀</h3><p>주민 · 매일 밤*, 오늘 낮에 악마가 투표했는지를 알게 됩니다.</p></article><article><h3>곡예사</h3><p>주민 · 당신의 첫 번째 낮에, 공개적으로 플레이어들의 캐릭터를 최대 5번까지 추측합니다. 그날 밤, 그중 몇 개나 맞혔는지를 알게 됩니다.</p></article><article><h3>수학자</h3><p>주민 · 매일 밤, (새벽부터 지금까지) 다른 플레이어의 능력으로 인해 비정상적으로 작동한 플레이어 능력이 몇 개나 되는지를 알게 됩니다.</p></article><article><h3>예언자</h3><p>주민 · 매일 밤*, 사망한 플레이어 가운데 몇 명이나 악한 팀인지를 알게 됩니다.</p></article><article><h3>철학자</h3><p>주민 · 게임당 1번, 밤에, 선한 캐릭터 1명을 선택합니다: 그의 능력을 얻습니다. 그 캐릭터가 이미 게임에 참여하고 있다면, 그는 취합니다.</p></article><article><h3>현자</h3><p>주민 · 악마가 당신을 죽이면, 플레이어 2명을 알게 됩니다.그중 1명이 악마입니다.</p></article><article><h3>백치천재</h3><p>주민 · 매일 낮, 개인적으로 이야기꾼을 찾아가 두 가지 정보를 알게 됩니다. 그 중 하나는 진실이고 다른 하나는 거짓입니다.</p></article><article><h3>재봉사</h3><p>주민 · 게임당 1번, 밤에, (당신을 제외하고) 플레이어 2명을 선택합니다: 그들이 같은 소속인지 아닌지를 알게 됩니다.</p></article><article><h3>뱀 조련사</h3><p>주민 · 매일 밤, 생존한 플레이어 1명을 선택합니다: 악마를 선택했다면, 악마는 당신과 소속 및 캐릭터를 맞바꾼 다음 중독됩니다.</p></article><article><h3>포고꾼</h3><p>주민 · 매일 밤*, 오늘 낮에 하수인이 지목에 나섰는지를 알게 됩니다.</p></article><article><h3>이발사</h3><p>이방인 · 오늘 낮 또는 오늘 밤에 사망했다면, 악마는 플레이어 2명(다른 악마는 제외)을 선택하여 그 두 명의 캐릭터를 맞바꿀 수 있습니다.</p></article><article><h3>얼뜨기</h3><p>이방인 · 당신이 사망했음을 알게 될 때, 생존한 플레이어 1명을 공개적으로 선택합니다: 그가 악한 플레이어라면, 당신이 속한 팀이 패배합니다.</p></article><article><h3>변종</h3><p>이방인 · 당신이 “이방인”이라는 사실에 집착한다면, 당신은 처형당할 수도 있습니다.</p></article><article><h3>사랑꾼</h3><p>이방인 · 당신이 사망할 때, 지금부터 플레이어 1명은 취함 상태가 됩니다.</p></article><article><h3>세레노버스</h3><p>하수인 · 매일 밤, 플레이어 1명과 선한 캐릭터 하나를 선택합니다: 선택된 플레이어는 다음 날 자신이 해당 캐릭터라고 집착해야 합니다. 그렇지 않으면, 처형당할 수도 있습니다.</p></article><article><h3>사악한 쌍둥이</h3><p>하수인 · 당신과 선한 쌍둥이는 서로를 알아봅니다. 선한 쌍둥이가 처형당하면, 악한 팀이 승리합니다. 쌍둥이가 둘 다 살아있는 한, 선한 팀은 승리할 수 없습니다.</p></article><article><h3>마귀할멈</h3><p>하수인 · 매일 밤*, 플레이어 1명과 캐릭터 하나를 선택하고, (그 캐릭터가 게임에 참여하지 않았을 경우) 그를 선택한 캐릭터로 바꿉니다: 이 능력으로 악마를 만든다면, 오늘 밤 예측불허의 죽음이 찾아옵니다.</p></article><article><h3>마녀</h3><p>하수인 · 매일 밤, 플레이어 1명을 선택합니다: 그가 다음 날 누군가를 지목한다면, 그는 사망합니다. 생존한 플레이어가 3명만 남았다면, 이 능력을 잃습니다.</p></article><article><h3>팡 구</h3><p>악마 · 매일 밤*, 플레이어 1명을 선택합니다: 그는 사망합니다. 이 능력으로 사망한 첫 이방인만이 악한 팡 구가 되고 당신이 대신 사망합니다. [이방인 +1명]</p></article><article><h3>노 다시</h3><p>악마 · 매일 밤*, 플레이어 1명을 선택합니다: 그는 사망합니다. 당신의 이웃 주민 2명은 중독됩니다.</p></article><article><h3>비고르모르티스</h3><p>악마 · 매일 밤*, 플레이어 1명을 선택합니다: 그는 사망합니다. 당신이 죽인 하수인은 능력을 유지하며, 그의 이웃 주민 중 1명이 중독됩니다. [이방인 -1명]</p></article><article><h3>보르톡스</h3><p>악마 · 매일 밤*, 플레이어 1명을 선택합니다: 그는 사망합니다. 주민의 능력은 거짓 정보만 제공합니다. 매일 낮, 누구도 처형되지 않으면 악한 팀이 승리합니다.</p></article></section>
<section><h2>캐러셀</h2><article><h3>기예꾼</h3><p>주민 · 매일 밤*, 플레이어 1명을 선택합니다: 그가 현재 또는 오늘 밤 취함/중독 상태가 되면 당신은 사망합니다.</p></article><article><h3>연금술사</h3><p>주민 · 당신은 하수인 하나의 능력을 갖습니다. 이 능력을 사용할 때, 이야기꾼이 다른 선택을 하라고 지시할 수도 있습니다.</p></article><article><h3>알사히르</h3><p>주민 · 매일 낮, 공개적으로 누가 하수인이고 악마인지 추측합니다. 성공하면 선한 팀이 승리합니다.</p></article><article><h3>기억상실자</h3><p>주민 · 당신의 능력이 무엇인지 모릅니다. 매일 낮, 비공개로 능력을 추측합니다: 추측이 얼마나 정확한지 알아냅니다.</p></article><article><h3>무신론자</h3><p>주민 · 이야기꾼은 게임 규칙을 어길 수 있습니다. 이야기꾼이 처형당하면 선한 팀이 승리합니다(당신이 사망한 상태더라도). [악한 캐릭터 없음]</p></article><article><h3>열기구 조종사</h3><p>주민 · 매일 밤, 직전 밤과는 다른 유형에 속한 캐릭터 플레이어 1명을 알게 됩니다. [이방인 +0명 또는 +1명]</p></article><article><h3>밴시</h3><p>주민 · 악마가 당신을 죽이면, 모두가 이 사실을 알게 됩니다. 지금부터, 당신은 매일 낮에 2번 지목하고 지목마다 2표씩 행사할 수 있습니다.</p></article><article><h3>현상금 사냥꾼</h3><p>주민 · 게임 시작 시, 악한 플레이어 1명을 알게 됩니다. 알게 된 플레이어가 사망하면, 그날 밤 다른 악한 플레이어를 알게 됩니다. [주민 1명이 악한 팀]</p></article><article><h3>식인종</h3><p>주민 · 최근에 처형당해 사망한 캐릭터의 능력을 갖습니다. 그가 악한 팀이었다면, 선한 플레이어가 처형으로 사망하기 전까지 당신은 중독됩니다.</p></article><article><h3>성가대 소년</h3><p>주민 · 악마가 왕을 죽이면, 누가 악마인지 알게 됩니다. [+왕]</p></article><article><h3>사교 교주</h3><p>주민 · 매일 밤, 이웃 생존자 1명과 같은 팀이 됩니다. 모든 선한 플레이어가 교단에 가입하면, 당신이 속한 팀이 승리합니다.</p></article><article><h3>기계공</h3><p>주민 · 게임당 1번, 밤에, 게임에 어떤 하수인들이나 악마가 참여하는지를 선택할 수 있습니다.</p></article><article><h3>농부</h3><p>주민 · 당신이 밤에 사망하면, 생존한 선한 플레이어 1명이 농부가 됩니다.</p></article><article><h3>낚시꾼</h3><p>주민 · 게임당 1번, 낮 동안, 이야기꾼을 방문하여 당신의 팀이 승리하기 위한 조언을 구합니다.</p></article><article><h3>장군</h3><p>주민 · 매일 밤, 당신은 이야기꾼이 보기에 어떤 팀이 우세한 팀인지 알게 됩니다(선한/악한/둘 다 아님 중 하나).</p></article><article><h3>대사제</h3><p>주민 · 매일 밤, 이야기꾼이 보기에 당신이 가장 많이 이야기해봐야 할 사람을 알게 됩니다.</p></article><article><h3>사냥꾼</h3><p>주민 · 게임당 1번, 밤에, 생존한 플레이어 1명을 선택합니다: 아가씨를 선택했다면, 아가씨는 게임에 참여하지 않는 주민으로 바뀝니다. [+아가씨]</p></article><article><h3>왕</h3><p>주민 · 매일 밤, 사망한 플레이어 수가 생존한 플레이어 수 이상이라면, 생존한 캐릭터 1명을 알게 됩니다. 악마는 당신이 왕이라는 사실을 알고 있습니다.</p></article><article><h3>기사</h3><p>주민 · 게임 시작 시, 악마가 아닌 플레이어 2명을 알게 됩니다.</p></article><article><h3>늑대인간</h3><p>주민 · 매일 밤*, 생존한 플레이어 1명을 선택합니다. 그가 선하다면, 그는 사망하고 악마는 오늘 밤에 누구도 죽이지 않습니다. 선한 플레이어 1명이 악한 팀으로 위장됩니다.</p></article><article><h3>마술사</h3><p>주민 · 악마는 당신을 하수인이라고 생각합니다. 하수인들은 당신을 악마라고 생각합니다.</p></article><article><h3>야경꾼</h3><p>주민 · 게임당 1번, 밤에, 플레이어 1명을 선택합니다: 그는 당신이 야경꾼임을 알게 됩니다.</p></article><article><h3>귀족</h3><p>주민 · 게임 시작 시, 플레이어 3명 중 1명이 악한 팀임을 알게 됩니다(3명 중 단 1명만 악한 팀).</p></article><article><h3>픽시</h3><p>주민 · 게임 시작 시, 게임에 참여하는 주민 캐릭터 1명을 알게 됩니다. 당신이 그 캐릭터인 것처럼 집착했다면, 그 캐릭터 플레이어가 사망했을 때 그 능력을 얻습니다.</p></article><article><h3>양귀비 재배꾼</h3><p>주민 · 하수인과 악마가 서로를 알지 못합니다. 당신이 사망하면, 그날 밤 이들은 서로를 알게 됩니다.</p></article><article><h3>전도사</h3><p>주민 · 매일 밤, 플레이어 1명을 선택합니다: 하수인을 선택했다면, 하수인은 그 사실을 알게 됩니다. 선택된 모든 하수인은 능력을 잃습니다.</p></article><article><h3>공주</h3><p>주민 · 당신의 첫 번째 낮에, 당신이 플레이어 1명을 지목하여 처형한다면, 악마는 오늘 밤 누구도 죽이지 않습니다.</p></article><article><h3>수행자</h3><p>주민 · 게임 시작 시, 가장 가까운 악한 플레이어가 시계 방향에 있는지 반시계 방향에 있는지 알게 됩니다. 동거리라면, 이 정보는 임의로 주어집니다.</p></article><article><h3>시종</h3><p>주민 · 게임 시작 시, 선한 플레이어 1명을 알게 됩니다.</p></article><article><h3>마을 백치</h3><p>주민 · 매일 밤, 플레이어 1명을 선택합니다: 그의 팀을 알게 됩니다. [+0~+2 마을 백치. 그중 1명은 취함.]</p></article><article><h3>아가씨</h3><p>이방인 · 모든 하수인은 아가씨가 게임에 참여한다는 사실을 압니다. 하수인이 당신을 공개적으로 추측해 내면(여러명 중 단 1번만 가능), 당신이 속한 팀이 패배합니다.</p></article><article><h3>골렘</h3><p>이방인 · 게임당 1번만 지목할 수 있습니다. 그렇게 했고 지목받은 플레이어가 악마가 아니라면, 그 플레이어는 사망합니다.</p></article><article><h3>모자 장수</h3><p>이방인 · 당신이 오늘 낮 또는 밤에 사망하면, 하수인과 악마 플레이어들은 새로운 하수인과 악마 캐릭터를 선택할 수 있습니다.</p></article><article><h3>배교자</h3><p>이방인 · 승리하는 팀은 패배하고 패배하는 팀은 승리합니다(당신이 사망한 상태더라도).</p></article><article><h3>둔세자</h3><p>이방인 · 당신은 모든 이방인의 능력을 갖습니다. [이방인 -0명 또는 -1명]</p></article><article><h3>오우거</h3><p>이방인 · 당신의 첫 번째 밤에, (당신을 제외하고) 플레이어 1명을 선택합니다: 당신은 그와 같은 팀(어느 팀인지까지는 알지 못하지만)이 됩니다. (취함/중독 상태더라도)</p></article><article><h3>역병 의사</h3><p>이방인 · 당신이 사망하면, 이야기꾼은 하수인의 능력을 얻습니다.</p></article><article><h3>정치인</h3><p>이방인 · 당신이 속한 팀의 패배에 가장 크게 기여했다면, 팀을 바꾸고 승리합니다(사망한 상태더라도).</p></article><article><h3>퍼즐마스터</h3><p>이방인 · 플레이어 1명이 취합니다(당신이 사망하더라도). 누가 취했는지 추측하는 데 성공한다면(단 1번만 가능), 악마 플레이어가 누구인지 알게 됩니다. 추측이 틀리면, 거짓 정보를 얻습니다.</p></article><article><h3>밀고자</h3><p>이방인 · 각 하수인은 블러핑용 캐릭터 3명을 알게 됩니다.</p></article><article><h3>광신자</h3><p>이방인 · 플레이어가 5명 이상 생존해 있다면, 모든 지목에 투표해야 합니다.</p></article><article><h3>과학자</h3><p>하수인 · 악마는 (악마가 취함/중독 상태더라도) 게임에 참여하지 않는 선한 캐릭터의 능력을 갖습니다. 악마와 당신은 그 능력을 알게 됩니다.</p></article><article><h3>폭탄마</h3><p>하수인 · 당신이 처형당하면, 플레이어 3명 외에 모두 사망합니다. 10부터 1까지 카운트다운 후, 가장 많은 지목을 받은 플레이어가 사망합니다.</p></article><article><h3>공포의 전령</h3><p>하수인 · 매일 밤, 플레이어 1명을 선택합니다: 당신이 그를 지목하여 처형하면, 그가 속한 팀이 패배합니다. 당신이 새로운 플레이어를 선택하면 모두가 알게 됩니다.</p></article><article><h3>고블린</h3><p>하수인 · 당신이 지목받았을 때 고블린이라고 공개적으로 주장한 후 그날 처형당한다면, 당신이 속한 팀이 승리합니다.</p></article><article><h3>하피</h3><p>하수인 · 매일 밤 플레이어 2명을 선택합니다: 다음 날, 첫 번째 플레이어는 두 번째 플레이어가 악한 팀이라는 사실에 집착해야 합니다. 그렇지 않으면, 둘 중 하나 또는 둘 다 사망할 수 있습니다.</p></article><article><h3>꼭두각시</h3><p>하수인 · 당신은 선한 캐릭터라고 착각하지만, 실제로는 아닙니다. 악마는 당신이 누구인지 압니다. [당신은 악마와 이웃합니다]</p></article><article><h3>메제펠레스</h3><p>하수인 · 게임 시작 시, 비밀 단어를 알게 됩니다. 비밀 단어를 가장 먼저 말하는 선한 플레이어는 그날 밤 악한 팀이 됩니다.</p></article><article><h3>거리의 악사</h3><p>하수인 · 모든 플레이어는 투표할 때 눈을 감고, 투표 집계도 비밀리에 이뤄집니다. 매일 밤, 당신은 황혼까지 취하기로 선택할 수 있습니다.</p></article><article><h3>사이코패스</h3><p>하수인 · 매일 낮, 지목 절차 전에, 공개적으로 플레이어 1명을 선택할 수 있습니다: 그는 사망합니다. 당신이 처형당하면, 가위바위보에 질 경우에만 사망합니다.</p></article><article><h3>소환사</h3><p>하수인 · 블러핑용 캐릭터 3명을 알게 됩니다. 세 번째 밤에, 플레이어 1명을 선택합니다: 그는 악한 팀의 악마(당신이 선택)가 됩니다. [악마 없음]</p></article><article><h3>재상</h3><p>하수인 · 모두가 당신이 재상임을 알게 됩니다. 당신은 낮에 사망할 수 없습니다. 선한 팀이 투표했다면, 지목 대상을 즉시 처형할 수 있습니다.</p></article><article><h3>미망인</h3><p>하수인 · 당신의 첫 번째 밤에, 마도서를 확인해 보고 플레이어 1명을 선택합니다: 그는 중독됩니다. 선한 플레이어 1명은 미망인이 게임에 참여한다는 사실을 알게 됩니다.</p></article><article><h3>마법사</h3><p>하수인 · 게임당 1번, 소원을 빌 수 있습니다. 소원이 받아들여졌다면, 대가가 따르거나 단서가 제공될 수 있습니다(소원의 특징에 따라).</p></article><article><h3>악령</h3><p>하수인 · 밤에 눈을 뜰 수 있습니다. 다른 악한 플레이어가 깨어날 때 함께 깨어납니다.</p></article><article><h3>잔</h3><p>하수인 · X번째 밤에, 모든 주민은 황혼까지 중독됩니다. [이방인 X명]</p></article><article><h3>알 하디키아</h3><p>악마 · 매일 밤*, 플레이어 3명을 선택할 수 있습니다(모두가 선택된 플레이어가 누구인지 알게 됩니다): 각자 조용히 생존/사망을 선택합니다. 모두 생존하면, 역으로 모두 사망합니다.</p></article><article><h3>카잘리</h3><p>악마 · 매일 밤*, 플레이어 1명을 선택합니다: 그는 사망합니다. [당신은 하수인 플레이어와 캐릭터를 직접 선택할 수 있습니다. 이방인 -?명~+?명]</p></article><article><h3>군단</h3><p>악마 · 매일 밤*, 플레이어 1명이 사망할 수 있습니다. 악한 팀만 투표했다면 처형이 실패합니다. 당신은 하수인으로도 위장됩니다. [대부분의 플레이어가 군단입니다]</p></article><article><h3>레비아탄</h3><p>악마 · 선한 플레이어가 2명 이상 처형당하면, 악한 팀이 승리합니다. 모두가 당신이 게임에 참여하고 있음을 알게 됩니다. 다섯 번째 낮이 끝난 후, 악한 팀이 승리합니다.</p></article><article><h3>릴 몬스타</h3><p>악마 · 매일 밤, 하수인들은 누가 릴 몬스타를 돌볼지 선택합니다. 돌보는 플레이어는 &quot;악마입니다&quot;. 매일 밤*, 플레이어 1명이 사망할 수 있습니다. [하수인 +1명]</p></article><article><h3>거무리</h3><p>악마 · 매일 밤*, 플레이어 1명을 선택합니다: 그는 사망합니다. 게임 시작 시, 플레이어 1명을 선택합니다: 그는 중독됩니다. 그가 사망하면(그리고 오직 그가 사망하는 경우에만), 당신도 사망합니다.</p></article><article><h3>티폰의 군주</h3><p>악마 · 매일 밤*, 플레이어 1명을 선택합니다: 그는 사망합니다. [악한 캐릭터들이 일렬로 앉습니다. 그 중 당신은 가운데에 있습니다. 하수인 +1명. 이방인 -?명~+?명]</p></article><article><h3>오조</h3><p>악마 · 매일 밤*, 캐릭터 1명을 선택합니다: 그는 사망합니다. 해당 캐릭터가 게임에 참여하고 있지 않다면, 이야기꾼이 누가 사망할지를 선택합니다.</p></article><article><h3>폭도</h3><p>악마 · 세 번째 낮에, 하수인들은 폭도가 되고, 지목받은 플레이어는 사망하며 즉시 또 다른 생존한 플레이어를 지목합니다. 이 사건은 반드시 발생합니다.</p></article><article><h3>야가바블</h3><p>악마 · 게임 시작 시, 비밀 문구를 알게 됩니다. 오늘 당신이 이를 공개적으로 발언한 횟수 만큼 플레이어가 사망할 수 있습니다.</p></article><article><h3>낄낄이</h3><p>여행자 · 캐러셀 · 매일 낮, 플레이어 1명을 선택합니다: 오늘 밤, 다른 플레이어 1명의 캐릭터가 바뀝니다.</p></article><article><h3>갱단원</h3><p>여행자 · 캐러셀 · 매일 낮 1번, 생존한 이웃 1명을 선택해서 죽일 수 있습니다(단, 당신 및 다른 생존한 이웃 1명이 합의했을 경우에 한해).</p></article><article><h3>노움</h3><p>여행자 · 캐러셀 · 모든 플레이어는 게임 시작 시, 당신과 같은 팀에 속한 플레이어 1명을 알게 됩니다. 그를 지목한 플레이어를 죽일 수 있습니다.</p></article><article><h3>데우스 엑스 피아스코</h3><p>전설적인 캐릭터 · 게임당 최소 1번 이상, 이야기꾼은 실수를 하고, 그 실수를 정정하고, 공개적으로 실수를 인정합니다.</p></article><article><h3>뱃사공</h3><p>전설적인 캐릭터 · 마지막 날 낮에, 사망한 플레이어 모두가 투표 토큰을 다시 얻습니다.</p></article><article><h3>폭풍 부르미</h3><p>설화적인 캐릭터 · 선한 캐릭터 1명의 이름을 댑니다. 해당 캐릭터가 게임에 참여하고 있다면, 그는 처형으로만 사망할 수 있지만, 악한 플레이어들은 그가 어느 플레이어인지 알게 됩니다.</p></article></section>
<section><h2>Xenophobia</h2></section>
<section><h2>여행자</h2><article><h3>거지</h3><p>여행자 · 점철되는 혼란 · 투표하려면 투표 토큰이 필요합니다. 사망한 플레이어에게서 투표 토큰을 받으면, 그의 소속을 알아냅니다. 당신은 맨정신이며 건강합니다.</p></article><article><h3>관료</h3><p>여행자 · 점철되는 혼란 · 매일 밤, (당신을 제외하고) 플레이어 1명을 선택합니다: 다음 날, 그의 투표는 3표로 계산합니다.</p></article><article><h3>총잡이</h3><p>여행자 · 점철되는 혼란 · 매일 낮, 첫 번째 투표를 집계한 후, 투표에 참여한 플레이어 1명을 선택할 수 있습니다: 그는 사망합니다.</p></article><article><h3>희생양</h3><p>여행자 · 점철되는 혼란 · 당신의 팀 소속 플레이어 1명이 처형당하면, 당신이 대신 처형당할 수도 있습니다.</p></article><article><h3>도둑</h3><p>여행자 · 점철되는 혼란 · 매일 밤, (당신을 제외하고) 플레이어 1명을 선택합니다: 다음 날, 그의 투표는 음수로 계산합니다.</p></article><article><h3>수습생</h3><p>여행자 · 피로 물든 달 · 당신의 첫 번째 밤에, 선한 팀이라면 주민의 능력을, 악한 팀이라면 하수인의 능력을 얻습니다.</p></article><article><h3>주교</h3><p>여행자 · 피로 물든 달 · 이야기꾼만이 누군가를 지목할 수 있습니다. 매일 낮, 상대 팀 플레이어 1명 이상이 지목되어야 합니다.</p></article><article><h3>판사</h3><p>여행자 · 피로 물든 달 · 게임당 1번, 다른 플레이어가 누군가를 지목했을 때, 이번 처형의 성패를 당신이 단독으로 선택할 수 있습니다.</p></article><article><h3>가정교사</h3><p>여행자 · 피로 물든 달 · 매일 낮, 플레이어 2명의 자리를 맞바꿀 수 있습니다(매일 낮 총 3번까지 가능). 플레이어들은 자기 자리를 떠나 1:1로 대화할 수 없습니다.</p></article><article><h3>부두술사</h3><p>여행자 · 피로 물든 달 · 오직 사망한 플레이어와 당신만 투표할 수 있습니다. 투표 토큰 없이도 투표할 수 있으며, 50% 이상의 찬성표를 요하지 않습니다.</p></article><article><h3>바리스타</h3><p>여행자 · 화단에 꽃피운 이단 · 매일 밤, 황혼이 될 때까지 플레이어 1명으로 하여금, 1) 맨정신 및 건강한 상태로 진실된 정보만 얻게 만들거나 2) 능력이 2번 작동하게 합니다. 그는 둘 중 무엇을 적용받는지 알게 됩니다.</p></article><article><h3>뼈 수집가</h3><p>여행자 · 화단에 꽃피운 이단 · 게임당 1번, 밤에*, 사망한 플레이어 1명을 선택합니다: 그는 황혼까지 자기 능력을 되찾습니다.</p></article><article><h3>푸주한</h3><p>여행자 · 화단에 꽃피운 이단 · 매일 낮, 첫 번째 처형이 끝난 후, 당신은 한 번 더 지목할 수 있습니다.</p></article><article><h3>이단아</h3><p>여행자 · 화단에 꽃피운 이단 · 오늘 웃음을 선사했다면, 추방으로 사망할 수 없습니다.</p></article><article><h3>매춘부</h3><p>여행자 · 화단에 꽃피운 이단 · 매일 밤*, 생존한 플레이어 1명을 선택합니다: 그가 동의한다면, 그의 캐릭터를 알게 되지만 둘 다 사망할 수도 있습니다.</p></article></section>
<section><h2>진행·핵심 규칙</h2><article><h3>승리 조건</h3><p>선은 악마가 모두 사망하면, 악은 생존자가 2명만 남으면 승리합니다. 역할의 특별 승리 조건이 우선하며, 여행자는 이 생존자 수에서 제외합니다.</p></article><article><h3>지명·투표</h3><p>매일 생존자는 1회 지명할 수 있고, 각 플레이어는 1회 지명될 수 있습니다. 생존자 수의 절반 이상(올림)의 표가 필요합니다. 최다 득표자 1명을 처형하며 최다 동률이면 처형하지 않습니다. 역할에 따른 예외가 있습니다.</p></article><article><h3>사망 후</h3><p>사망해도 토론과 팀 승패에 참여합니다. 일반적으로 능력과 지명권을 잃고, 남은 게임 동안 투표는 1회만 할 수 있습니다. 죽어서도 작동하는 능력은 예외입니다.</p></article><article><h3>취함·중독 / 별표</h3><p>취하거나 중독되면 능력이 없지만 정상처럼 진행하며 거짓 정보를 받을 수 있습니다. 능력의 밤*은 첫날 밤을 제외한다는 뜻입니다. 대괄호 [ ]는 셋업 변경입니다.</p></article></section>
<section><h2>밤 순서</h2><article><h3>점철되는 혼란 · 첫날 밤</h3><p>하수인 정보 → 악마 정보 → 독살범 → 세탁부 → 사서 → 수사관 → 요리사 → 초공감자 → 점쟁이 → 집사 → 첩자</p></article><article><h3>점철되는 혼란 · 이후 밤</h3><p>독살범 → 수도사 → 탕녀 → 임프 → 까마귀지기 → 초공감자 → 점쟁이 → 장의사 → 집사 → 첩자</p></article><article><h3>피로 물든 달 · 첫날 밤</h3><p>하수인 정보 → 미치광이 → 악마 정보 → 선원 → 궁정대신 → 대부 → 악마의 변호사 → 푸카 → 할머니 → 객실 청소부</p></article><article><h3>피로 물든 달 · 이후 밤</h3><p>선원 → 궁정대신 → 여관 주인 → 도박사 → 악마의 변호사 → 미치광이 → 구마사제 → 좀버얼 → 푸카 → 샤발로스 → 포 → 암살자 → 대부 → 험담꾼 → 교수 → 땜장이 → 달의 자손 → 할머니 → 객실 청소부</p></article><article><h3>화단에 꽃피운 이단 · 첫날 밤</h3><p>철학자 → 하수인 정보 → 악마 정보 → 뱀 조련사 → 사악한 쌍둥이 → 마녀 → 세레노버스 → 시계공 → 꿈꾸는 자 → 재봉사 → 수학자</p></article><article><h3>화단에 꽃피운 이단 · 이후 밤</h3><p>철학자 → 뱀 조련사 → 마녀 → 세레노버스 → 마귀할멈 → 팡 구 → 노 다시 → 보르톡스 → 비고르모르티스 → 이발사 → 사랑꾼 → 현자 → 꿈꾸는 자 → 꽃팔이 소녀 → 포고꾼 → 예언자 → 재봉사 → 곡예사 → 수학자</p></article><article><h3>순서 적용</h3><p>게임에 있는 역할만 깨우고 각 능력의 조건을 확인합니다. 여행자와 역할의 특수 처리도 적용하세요. 5·6인에서는 일반 하수인·악마 정보를 생략합니다.</p></article></section>
<section><h2>셋업</h2><article><h3>5인</h3><p>주민 3 · 이방인 0 · 하수인 1 · 악마 1</p></article><article><h3>6인</h3><p>주민 3 · 이방인 1 · 하수인 1 · 악마 1</p></article><article><h3>7인</h3><p>주민 5 · 이방인 0 · 하수인 1 · 악마 1</p></article><article><h3>8인</h3><p>주민 5 · 이방인 1 · 하수인 1 · 악마 1</p></article><article><h3>9인</h3><p>주민 5 · 이방인 2 · 하수인 1 · 악마 1</p></article><article><h3>10인</h3><p>주민 7 · 이방인 0 · 하수인 2 · 악마 1</p></article><article><h3>11인</h3><p>주민 7 · 이방인 1 · 하수인 2 · 악마 1</p></article><article><h3>12인</h3><p>주민 7 · 이방인 2 · 하수인 2 · 악마 1</p></article><article><h3>13인</h3><p>주민 9 · 이방인 0 · 하수인 3 · 악마 1</p></article><article><h3>14인</h3><p>주민 9 · 이방인 1 · 하수인 3 · 악마 1</p></article><article><h3>15인</h3><p>주민 9 · 이방인 2 · 하수인 3 · 악마 1</p></article><article><h3>인원 계산·역할 조정</h3><p>표의 인원은 이야기꾼과 여행자를 제외합니다. 이야기꾼 1명이 별도로 필요합니다. 15명을 넘는 플레이어는 여행자로 참가합니다. 남작 등 [ ] 셋업 효과를 적용하고 토큰 수는 플레이어 수와 맞춥니다.</p></article><article><h3>5·6인과 첫날 정보</h3><p>5·6인에서는 악마와 하수인이 서로를 모르고 악마는 블러프 역할 3개를 받지 않습니다. 7인 이상은 일반 첫날 악팀 정보를 제공합니다. 입문은 점철되는 혼란을 권장하며 다른 두 시나리오는 7인 이상을 권장합니다.</p></article><article><h3>공통 준비</h3><p>시나리오 1개를 선택하고 역할표를 나눕니다. 원형으로 앉아 생명·투표 토큰을 준비합니다. 이야기꾼이 역할을 비밀리에 선택하고 셋업 효과를 적용한 뒤 토큰을 섞어 배분합니다. 마도서에 좌석 순서대로 기록하고 첫날 밤 순서표를 따릅니다.</p></article><article><h3>캐러셀 사용</h3><p>캐러셀은 고정 시나리오가 아닌 추가 캐릭터 모음입니다. 선택한 스크립트의 역할표·밤 순서·공식 징크스를 사용하세요. [ ] 셋업 변경을 적용하며, 전설적·설화적 캐릭터는 일반 역할처럼 주머니에 넣어 배분하지 않습니다.</p></article></section></noscript>
