<noscript><section><h2>기본 규칙</h2><article><h3>게임 흐름</h3><p>8라운드(3인은 9라운드). 매 라운드 모두 선택 다이얼로 목적지를 몰래 정하고, 차례대로 공개·이동·행동한 뒤, 라운드 끝에 명성 대결을 처리합니다.</p></article><article><h3>첫 라운드 전</h3><p>시작 플레이어부터 시계 방향으로 빈 장소(메디쿠스가 있는 곳 제외)를 고릅니다. 그곳 시장 가판대에 이발사를 놓고, 가장 싼 견습생 칸의 견습생 1명을 무료로 놓고, 그 장소의 편지를 내 판으로 가져옵니다.</p></article><article><h3>라운드 시작</h3><p>2라운드부터: 메디쿠스가 시계 방향으로 1칸 이동하고 명성 2를 얻습니다. 모두 새 목적지를 몰래 고르며, 지금 장소에 머물 수 없습니다.</p></article><article><h3>내 차례</h3><p>1 다이얼 공개 → 2 현재 장소의 시장 가판대에 이발사 놓기 → 3 최단 경로로 목적지까지 이동 → 4 지나가는 경유지마다 보조 행동 → 5 목적지에서 주 행동 정확히 1개. 견습생 급료와 주 행동만 의무입니다.</p></article><article><h3>차례 끝</h3><p>이번 차례에 얻은 지식 마커를 판에 놓습니다(능력은 다음부터). 처음 달성한 아스클레피오스 지팡이 조건이 있으면 지팡이를 가져옵니다. 빈 호의 카드·도구·처방서·시장 가판대 칸을 보충합니다.</p></article><article><h3>명성 대결</h3><p>라운드 끝에 메디쿠스 장소부터 시계 방향으로: 인물 2개 이상이 있는 장소에서 명성이 가장 높은 쪽이 이깁니다(동점은 트랙에서 위에 있는 마커). 승자는 그곳에서 이번 차례와 다른 주 행동을 1번 더 하고 명성 1을 잃습니다. 메디쿠스나 중립 인물이 이기면 그 시장 가판대에 지식 마커를 놓고, 다음에 파는 사람이 가져갑니다.</p></article><article><h3>라운드 수</h3><p>4인: 메디쿠스가 처음 장소로 돌아오는 라운드가 마지막. 3인: 9라운드(한 장소 더). 2인: 장소 카드 덱이 8라운드를 정합니다.</p></article><article><h3>최종 점수</h3><p>(완성 처방서 + 1) × (시장 가판대 + 1) · 견습생 판 칸에 따라 2–6점 · 편지 1장당 1점(전령 마커마다 +1) · 도구는 위치에 따라 1–4점 · 금 지팡이 4점, 은 지팡이 2점 · 남은 동전·약재 2개당 1점 · 전문가 보너스. 동점은 명성 트랙이 높은 사람.</p></article><article><h3>약재</h3><p>7종 8개씩: 성수, 금잔화, 거머리, 장미 석영, 버섯, 약초, 알라우네(만드라고라). 약재·지식 마커·동전은 수량 제한이 없습니다.</p></article></section>
<section><h2>보조 행동</h2><article><h3>1 · 약재 모으기 (Collect Remedies)</h3><p>지나가는 길에 종류마다 최대 1개를 빈 주머니나 처방서의 맞는 칸에 놓습니다. 처방서에 2번째 약재가 놓이면 완성: 적힌 명성(같은 약재 2, 다른 약재 1)을 얻고 뒤집어 둡니다. 주머니와 처방서 사이에 옮길 수 없습니다.</p></article><article><h3>2 · 약재 팔기 (Sell Remedies)</h3><p>목적지에서 주머니의 약재를 맞는 칸에 팝니다: 놓기 전 빈칸 수(1–3)만큼 동전. 마지막 칸을 채우면 약재를 공급처로 돌리고 가판대를 뒤집어 가져가며, 거기 있던 지식 마커도 가져갑니다.</p></article><article><h3>3 · 견습생 급료 (Pay Apprentices)</h3><p>의무. 1개라도 팔았다면 이 장소에 있는 다른 사람의 견습생마다 공급처에서 동전 1개를 받습니다.</p></article><article><h3>4 · 편지 배달 (Deliver a Letter)</h3><p>맨 위 편지의 큰 문장이 지금 가는 장소와 같으면: 동전 1이나 명성 1을 받고, 편지는 점수용으로 보관하고, 그 장소의 편지를 새 배달 목표로 가져옵니다.</p></article><article><h3>5 · 처방서 사기 (Buy a Recipe book)</h3><p>처방서 칸 2개 중 하나가 비어 있으면 동전 1로 삽니다.</p></article><article><h3>6 · 메디쿠스 만나기 (Meet the Medicus)</h3><p>메디쿠스가 있는 장소에서 동전 2로 지식 마커 1개(차례 끝에 놓음).</p></article></section>
<section><h2>주 행동</h2><article><h3>돈 받기 (Take money)</h3><p>동전 2개.</p></article><article><h3>호의 카드 받기 (Take Favor cards)</h3><p>이 장소의 앞면 호의 카드를 가져옵니다. 따로 적혀 있지 않으면 내 차례 아무 때나 쓰며, 개수 제한이 없습니다.</p></article><article><h3>견습생 키우기 (Train an Apprentice)</h3><p>가장 싼 견습생 칸의 비용(동전 2–6)을 내고 이 장소에 견습생을 놓으며, 판에 적힌 명성을 얻습니다. 장소마다 내 견습생은 1명만.</p></article><article><h3>도구 사기 (Buy Instruments)</h3><p>동전 1로 1개, 또는 다른 인물이 함께 있으면 동전 3으로 2개(같은 더미에서 2개는 불가). 판 위에 왼쪽부터 놓고 같은 도구는 겹쳐 쌓으며, 그려진 동전·명성을 즉시 받습니다.</p></article></section>
<section><h2>호의 카드</h2><article><h3>1 · 각자의 길 (Individual Path)</h3><p>이번 라운드 앞 차례 사람이 같은 목적지를 골랐다면 목적지를 바꿉니다. (시작 카드, 뒷면이 플레이어 색)</p></article><article><h3>2 · 일찍 일어난 새 (Early Bird)</h3><p>출발 장소에서 원하는 주 행동 1개.</p></article><article><h3>3 · 최적의 조건 (Optimal Conditions)</h3><p>조건을 1 덜 채우고 아스클레피오스 지팡이 1개를 가져옵니다.</p></article><article><h3>4 · 다정한 선물 (Friendly Gift)</h3><p>출발 장소나 목적지에서 다른 인물 1개당 동전 2.</p></article><article><h3>5 · 끈적한 손가락 (Sticky Fingers)</h3><p>주 행동 뒤 시장 가판대의 약재를 원하는 만큼 가져옵니다. 2점.</p></article><article><h3>6 · 높은 수요 (High Demand)</h3><p>그림이 맞지 않는 시장 가판대 칸에 약재 1개를 팝니다.</p></article><article><h3>7 · 풍성한 발견 (Rich Find)</h3><p>약재를 모을 때 한 종류를 골라 담을 수 있는 만큼(모든 주머니와 맞는 처방서) 가져옵니다.</p></article><article><h3>8 · 자유로운 선택 (Free Choice)</h3><p>짧은 길 대신 긴 길로 이동할 수 있습니다.</p></article><article><h3>9 · 현찰 (Hard Cash)</h3><p>동전 3을 내고 목적지에서 주 행동을 1개 대신 전부 합니다.</p></article><article><h3>10 · 즐거운 체류 (Happy Stay)</h3><p>출발 장소를 목적지로 정합니다. 약재 모으기 대신 원하는 약재 1개를 받고 시장 가판대 단계부터 이어서 합니다.</p></article><article><h3>11 · 영광스러운 업적 (Glorious Deed)</h3><p>즉시 명성 2.</p></article><article><h3>12 · 개인 교습 (Private Lessons)</h3><p>메디쿠스가 있는 곳에서 동전 3으로 지식 마커 2개(평소 동전 2로 1개).</p></article><article><h3>13 · 특권 거래 (Privileged Trade)</h3><p>시장 가판대의 마지막 칸을 채우면 호의 카드 2장을 덱에서 뽑습니다.</p></article><article><h3>14 · 좋은 우정 (Good Friendship)</h3><p>내 장소에 인물이 3개 이상(나 포함)이면 4점.</p></article><article><h3>15 · 현명한 예견 (Wise Foresight)</h3><p>편지를 배달할 때 새로 받은 편지도 바로 배달한 것으로 칩니다: 다음 편지도 가져오고 보상(명성 1 또는 동전 1)을 한 번 더 받습니다.</p></article><article><h3>16 · 맞교환 (Mutual Exchange)</h3><p>목적지에서 내 도구 2개를 진열된 도구와 바꿉니다: 2개를 되돌리고 새 2개를 놓으며 즉시 보너스를 받습니다.</p></article><article><h3>17 · 공짜 보너스 (Free Bonus)</h3><p>도구 2개를 사면 덱에서 1개를 더 뽑습니다.</p></article><article><h3>18 · 후한 선물 (Generous Gift)</h3><p>도구를 정확히 1개 사면 다른 하나를 공짜로 가져옵니다(혼자 있어도 가능).</p></article><article><h3>19 · 높은 수익 (High Return)</h3><p>도구 1개를 동전 5에 팝니다.</p></article></section>
<section><h2>지식 마커</h2><article><h3>흥정 (Haggling)</h3><p>팔 때 빈칸 수 대신 가판대의 약재 그림 수(덮인 것 포함)만큼 동전.</p></article><article><h3>권위자 (Luminary)</h3><p>처방서 완성 시 별 1개면 +2점, 별 2개면 +3점.</p></article><article><h3>오볼루스 (Obolus)</h3><p>내 견습생이 있는 장소에서 누가 팔든 판 약재 1개당 동전 1(내가 팔 때도).</p></article><article><h3>전령 수수료 (Messenger's Fee)</h3><p>즉시 명성 1과 동전 1. 이후 편지 배달 때 두 보상을 모두 받습니다.</p></article><article><h3>팔방미인 (Jack of all Trades)</h3><p>명성 대결에서 이기면 이번 차례에 안 한 주 행동을 모두 합니다.</p></article><article><h3>특권 (Privilege)</h3><p>차례 시작에 현재 장소 맞은편에 그려진 약재를 빈 주머니에 넣을 수 있습니다.</p></article><article><h3>지루함 (Boredom)</h3><p>즉시 4점.</p></article><article><h3>전문가 (Specialist)</h3><p>최종 점수: 3개 이상 가진 도구 종류마다 +5점.</p></article><article><h3>전령 (Courier)</h3><p>게임 끝에 편지 1장마다 전령 마커 수만큼 +1점.</p></article><article><h3>추가 주머니 (Extra bag)</h3><p>추가 주머니를 판에 놓아 약재 1개를 더 보관하고, 주머니 → 처방서로 옮길 수 있습니다(반대는 불가).</p></article></section>
<section><h2>아스클레피오스의 지팡이</h2><article><h3>편지 6장 (6 Letters)</h3><p>편지 6장 보유.</p></article><article><h3>명성 15 (15 Prestige)</h3><p>명성 15 도달.</p></article><article><h3>지식 마커 5개 (5 Knowledge markers)</h3><p>지식 마커 5개 보유.</p></article><article><h3>도구 6종 (6 Instrument types)</h3><p>서로 다른 도구 6종 보유.</p></article><article><h3>처방서 4권 (4 Recipe books)</h3><p>처방서 4권 완성.</p></article><article><h3>시장 가판대 5개 (5 Market stalls)</h3><p>시장 가판대 5개 획득.</p></article><article><h3>견습생 5곳 (Apprentices in 5 Locations)</h3><p>서로 다른 장소 5곳에 견습생.</p></article></section></noscript>
