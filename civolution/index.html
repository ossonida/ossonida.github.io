<noscript><section><h2>기본</h2><article><h3>읽는 법</h3><p>&quot;상단&quot;은 설치 후에도 보이는 능력, &quot;(활동)&quot;은 핵심 행동 &quot;활동 1회&quot;로 쓰는 능력, &quot;하단&quot;은 설치할 때 받는 즉시 보너스입니다. &quot;기술 +2&quot;는 해당 진행 트랙 원반을 2칸 전진한다는 뜻입니다. &quot;게임 종료 점수 보너스&quot;는 최종 점수 계산에서 받습니다.</p></article><article><h3>연구 카드 종류</h3><p>발명: 비용에 항상 저장 자원, 자주 손재주·지능. 보너스는 주로 기술. 돌연변이: 특성 요구만. 보너스는 주로 아게라의 호의이며 진행 트랙 보너스는 없음. 통찰: 특성·자원·혼합. 보너스는 주로 지식. 건축물: 저장 자원만 요구하며 대부분 정착지 건설 수로 대체 가능. 보너스는 주로 건설. 업적: 특성·자원·혼합. 보너스는 주로 문화.</p></article><article><h3>지역 용어</h3><p>내 지역: 내 부족이 1개 이상 있는 지역(농장·배·원자재만으로는 안 됨). 외국 지역: 내 부족은 없고 다른 문명 부족이 있는 지역. 개척된 지역: 자원 타일이 앞면인 육지 지역, 그리고 모든 물 지역.</p></article><article><h3>약화와 강화</h3><p>강한(선) 부족을 약화하면 눕힙니다. 약한(누운) 부족을 약화하면 공급처로 돌려보냅니다. 강화는 누운 부족을 세우는 것입니다.</p></article><article><h3>이벤트 대상</h3><p>&quot;각 문명&quot;: 조건을 충족한 모두. &quot;모든 문명&quot;: 최다 보유자, 동률이면 동률 모두(0개는 최다가 아님). &quot;그 문명&quot;: 단독 선두만.</p></article><article><h3>정오표(초판)</h3><p>용어집: B21 자기 감각, D13 방앗간 문구 수정과 누락된 목표 칩 35~39 설명(이 레퍼런스에 반영). 규칙서 33쪽: 신비한 참나무 예시의 &quot;산 B&quot;는 &quot;산 D&quot;가 맞습니다.</p></article></section>
<section><h2>발명 카드 (A)</h2><article><h3>A1 · 제도용 컴퍼스 (Drawing compass)</h3><p>하단: 계획 모듈을 레벨 III로 업그레이드합니다(이미 III이면 없음).</p></article><article><h3>A2 · 물감 (Paint)</h3><p>하단: 기술·위신·건설 트랙 각 +1.</p></article><article><h3>A3 · 시계 (Clock)</h3><p>하단: 기술 트랙 +4.</p></article><article><h3>A4 · 안경 (Glasses)</h3><p>상단(활동): 연구 카드 1장 획득 — 공개된 연구 더미를 모두 훑어보고 아무 카드나 가져올 수 있습니다. 더미 순서는 바꾸지 않습니다. 하단: 아게라의 호의 +1.</p></article><article><h3>A5 · 나사 (Screw)</h3><p>상단: 게임 종료 점수 보너스. 하단: 기술 +2.</p></article><article><h3>A6 · 활과 화살 (Bow and arrow)</h3><p>상단: 사냥할 때마다 사냥표 보상에 더해 식량 1개와 2점을 얻습니다(부양 모듈 III의 연속 사냥은 각각 적용). 하단: 부양 모듈 1레벨 업그레이드(가능하면).</p></article><article><h3>A7 · 나침반 (Magnetic compass)</h3><p>하단: 탐험·이주 모듈을 각각 1레벨 업그레이드(가능하면).</p></article><article><h3>A8 · 쟁기 (Plow)</h3><p>상단: 초원(또는 초원에 인접한 배)에서 원자재를 운송할 때 파피루스·약초·금 중 원하는 칸에 저장할 수 있습니다. 놓은 뒤에는 바꿀 수 없습니다. 하단: 활동 최대 2회(같은 활동 2회 가능).</p></article><article><h3>A9 · 흑색 화약 (Black Powder)</h3><p>상단: 내 강한 부족이 다른 지역에서 개척된 지역으로 들어갈 때마다 그 지역에 원자재 1개를 생산합니다.</p></article><article><h3>A10 · 온도계 (Thermometer)</h3><p>상단: 날씨 표시기가 어두운 선을 넘을 때마다(이벤트 단계 A 또는 C19 기상학) 선 하나당 2점.</p></article><article><h3>A11 · 의술 (Medicine)</h3><p>하단: 체력·손재주·표현력·시야 특성 마커 각 1개.</p></article><article><h3>A12 · 보호복 (Protective wear)</h3><p>상단: 이벤트 단계 A에서 날씨 표시기가 흰 선을 넘어 발동한 효과를 무시할 수 있습니다. 더움·추움의 부정 효과는 제외. 하단: 체력 특성 마커 2개.</p></article><article><h3>A13 · 도끼 (Axe)</h3><p>상단: 숲 지역에 원자재를 생산할 때마다 같은 수의 마커를 해당 종류 창고 칸에도 놓습니다(E14 관개의 추가 생산 포함). 하단: 활동 1회.</p></article><article><h3>A14 · 유리 (Glass)</h3><p>상단: 발명 카드를 설치할 때 석탄·모래를 요구하는 비용 칸은 내지 않아도 충족된 것으로 봅니다. 하단: 목표 칩 1개 획득 또는 설치.</p></article><article><h3>A15 · 밧줄 (Rope)</h3><p>상단: 산(또는 산에 인접한 배)에서 원자재를 운송할 때 돌·철광석·옥 중 원하는 칸에 저장할 수 있습니다. 놓은 뒤에는 바꿀 수 없습니다. 하단: 활동 최대 2회(같은 활동 2회 가능).</p></article><article><h3>A16 · 어망 (Fishing net)</h3><p>상단(활동): 물 지역 1곳을 고릅니다(배 유무 무관). 그 지역에 인접한 모든 지역의 내 약한 부족을 원하는 만큼 세웁니다. 하단: 목표 칩 1개 획득 또는 설치.</p></article><article><h3>A17 · 낫 (Sickle)</h3><p>상단(활동): 저장된 파피루스 또는 약초 1개를 반납하고 돈 3개와 4점을 얻습니다. 하단: 아게라의 호의 +1.</p></article><article><h3>A18 · 망치 (Hammer)</h3><p>상단: 산 지역에 원자재를 생산할 때마다 같은 수의 마커를 해당 종류 창고 칸에도 놓습니다(E6 다이너마이트의 추가 생산 포함). 하단: 활동 1회.</p></article><article><h3>A19 · 톱 (Saw)</h3><p>상단: 숲(또는 숲에 인접한 배)에서 원자재를 운송할 때 나무·밀랍·기름 중 원하는 칸에 저장할 수 있습니다. 놓은 뒤에는 바꿀 수 없습니다. 하단: 활동 최대 2회(같은 활동 2회 가능).</p></article><article><h3>A20 · 기중기 (Crane)</h3><p>상단: 정착지를 지을 때 건설 비용 중 자원 하나만 냅니다(예: 나무 1 + 돌 1이면 둘 중 하나만 반납).</p></article><article><h3>A21 · 망원경 (Telescope)</h3><p>하단: 기술 +2, 시야 특성 마커 2개.</p></article><article><h3>A22 · 악기 (Music instruments)</h3><p>하단: 기술 +2, 문화 +1.</p></article><article><h3>A23 · 주판 (Abacus)</h3><p>하단: 기술 +1, 지식 +2.</p></article><article><h3>A24 · 도자기 (Porcelain)</h3><p>하단: 위신 +2, 문화 +1.</p></article><article><h3>A25 · 현미경 (Microscope)</h3><p>하단: 기술 +1, 지식 +2.</p></article><article><h3>A26 · 잉크 (Ink)</h3><p>하단: 기술 +2, 문화 +1.</p></article><article><h3>A27 · 화장품 (Makeup)</h3><p>하단: 위신 +3.</p></article><article><h3>A28 · 바퀴 (Wheel)</h3><p>상단: 게임 종료 점수 보너스. 하단: 기술 +2.</p></article><article><h3>A29 · 종이 (Paper)</h3><p>상단: 게임 종료 점수 보너스. 하단: 지식 +2.</p></article><article><h3>A30 · 옷감 (Cloth)</h3><p>상단: 게임 종료 점수 보너스. 하단: 위신 +2.</p></article><article><h3>A31 · 그릇 (Dishes)</h3><p>상단: 게임 종료 점수 보너스. 하단: 문화 +2.</p></article><article><h3>A32 · 이정표 (Milestone)</h3><p>상단: 게임 종료 점수 보너스. 하단: 공급처의 마커 6개를 주사위 칸 6곳에 하나씩 놓습니다. 바로 쓸 수 있는 계획 마커입니다.</p></article></section>
<section><h2>돌연변이 카드 (B)</h2><article><h3>B1 · 부리 (Beak)</h3><p>상단(활동): 행운의 발견 1회. 부족이 없는 지형이어도 육지 지형 6종 중 아무 곳이나 고를 수 있습니다. 하단: 아게라의 호의 +1.</p></article><article><h3>B2 · 갈기 (Mane)</h3><p>상단: 위신 트랙 원반이 옅은 칸(어두운 숫자)에서 이동을 마치면 다음 흰 숫자 칸으로 더 전진합니다(예: 5 → 7). 지나가기만 하면 해당 없음. 획득 시 이미 그 칸에 있으면 효과 없음. 이 추가 전진은 B22 보호색에 쓸 수 없습니다.</p></article><article><h3>B3 · 생체 음파 (Bio sonar)</h3><p>상단: 탐험 모듈로 장소를 공개하면 공개한 장소마다 1점을 추가로 얻습니다. 하단: 아게라의 호의 +1.</p></article><article><h3>B4 · 목 주름 (Neck frill)</h3><p>상단: 장소 단계에서 그림울프 협곡을 무시합니다. 하단: 아게라의 호의 +1.</p></article><article><h3>B5 · 겹눈 (Compound eyes)</h3><p>상단: 연구 카드 1장을 얻을 때마다 공개 연구 더미에서 아무 카드나 고를 수 있습니다(순서 유지). 이벤트가 특정 공개 더미의 맨 위 카드를 주면 그 더미의 아무 카드나 가져옵니다. 하단: 연구 모듈 1레벨 업그레이드(가능하면).</p></article><article><h3>B6 · 난생 (Oviparity)</h3><p>하단: 번식 모듈을 레벨 III로 업그레이드합니다.</p></article><article><h3>B7 · 집게 (Pincer)</h3><p>상단(활동): 이미 마커가 있는 창고 칸 하나에 공급처 마커 1개를 추가합니다. 하단: 아게라의 호의 +1.</p></article><article><h3>B8 · 야간 시력 (Night vision)</h3><p>상단(활동): 공개된 동굴에 인접한 내 지역이 있으면 마커 1개를 돌 또는 철광석 창고 칸에 놓습니다. 하단: 아게라의 호의 +1.</p></article><article><h3>B9 · 잡는 꼬리 (Prehensile tail)</h3><p>상단(활동): 대륙의 내 원자재 2개를 창고로 운송합니다. 하단: 생산 모듈 1레벨 업그레이드(가능하면).</p></article><article><h3>B10 · 지느러미발 (Flippers)</h3><p>상단: 생산 모듈을 쓸 때마다 추가로, 내 육지 지역에 인접한 물 지역 1곳에 마커를 놓고 배에서 가져오듯 곧바로 창고로 운송합니다(배가 없어도 됨).</p></article><article><h3>B11 · 날개 (Wings)</h3><p>상단: 이주할 때 인접 지역 대신, 식량 1개를 반납하고 대륙의 아무 야영지에 부족을 놓을 수 있습니다(밀어내기·불 야영지·개척 규칙은 평소대로).</p></article><article><h3>B12 · 물갈퀴 (Webbing)</h3><p>상단: 같은 물 지역에 닿은 지역끼리는 모든 행동에서 인접한 것으로 봅니다(예: 물 건너 이주, B13 코와 함께 물 건너 생산). 장소에는 적용되지 않으며, 장소는 실제로 닿은 지역에만 인접합니다.</p></article><article><h3>B13 · 코 (Trunk)</h3><p>상단: 원자재를 생산할 때마다 각각을 내 지역 또는 내 지역에 인접한 개척된 육지 지역에 놓을 수 있습니다.</p></article><article><h3>B14 · 개구리 혀 (Frog tongue)</h3><p>상단: 늪 지역 야영지에 있는 내 부족은 절대 약해지지 않습니다(빙하, 식량 단계, 밀어내기 포함). 늪의 황야에 있는 부족은 평소대로 약해집니다.</p></article><article><h3>B15 · 땀샘 (Sweat glands)</h3><p>상단(활동): 날씨가 따뜻함 또는 더움이면 저장 소금 1개, 집중 마커 1개, 1점을 얻습니다. 하단: 아게라의 호의 +1.</p></article><article><h3>B16 · 전위 (Proventiculus)</h3><p>상단(활동): 식량 1개를 반납하고 아무 지역 2곳을 골라 그곳의 내 약한 부족을 모두 세웁니다. 하단: 아게라의 호의 +1.</p></article><article><h3>B17 · 혹 (Humps)</h3><p>상단: 사막 지역 야영지의 내 부족은 식량 단계에서 식량이 필요 없습니다.</p></article><article><h3>B18 · 털가죽 (Fur)</h3><p>상단: 식량 단계 B에서 날씨가 비 또는 추움이면 강한 부족마다 1점 대신 2점을 얻습니다.</p></article><article><h3>B19 · 엄니 (Tusks)</h3><p>상단: 사냥할 때마다 사냥표보다 식량을 1개 더 얻습니다.</p></article><article><h3>B20 · 발굽 (Hooves)</h3><p>상단: 초원이나 언덕으로 이주할 때 정착하지 않고 통과해 인접 지역으로 갈 수 있습니다. 다음 지역도 초원·언덕이면 계속 통과할 수 있습니다(통과 규칙은 평소대로).</p></article><article><h3>B21 · 자기 감각 (Magnetoreception)</h3><p>상단(활동): 내 강한 부족 1개를 대륙 어디에서든 외국 육지 지역의 빈 야영지로 옮겨 세웁니다. 빈 야영지가 있고, 내 부족이 없고, 다른 문명 부족이 있는 지역만 가능하며 밀어낼 수 없습니다.</p></article><article><h3>B22 · 보호색 (Color change)</h3><p>상단: 즉시 보너스로 진행 트랙을 여러 칸 전진할 때 일부를 아무 트랙에나 쓸 수 있습니다. 2+2면 1+1은 표기대로, 2칸은 자유롭게. 한 트랙 3칸이면 2칸은 표기대로, 1칸은 자유롭게. 3개 트랙 각 1칸이면 쓸 수 없습니다.</p></article><article><h3>B23 · 거대한 뇌 (Giant brain)</h3><p>상단: 리셋 B단계에서 굴린 뒤 놓기 전에 굴린 활성화 주사위 하나를 원하는 면으로 돌립니다. 주사위 칸에 남겨 두어 굴리지 않은 주사위에는 쓸 수 없습니다.</p></article><article><h3>B24 · 예민한 후각 (Fine sense of smell)</h3><p>상단: 사냥 전에 강한 부족 1개를 인접한 외국 지역으로 이주시킬 수 있습니다(이주 규칙 적용). 이후 평소대로 사냥합니다. 부양 모듈 III로 2번 사냥하면 각 사냥 전에 쓸 수 있습니다.</p></article><article><h3>B25 · 주머니 (Pouch)</h3><p>상단: 강한 부족이 X에서 Y로 이주하면 X의 다른 강한 부족 1개도 Y로 따라갈 수 있습니다. 같은 지역을 통과하며, 지나는 배에는 빈자리 2개가 필요합니다. B11 날개를 쓰면 따라가는 부족은 식량을 더 내지 않습니다. 둘이 같은 야영지에 정착할 수 있고, 두 번째가 첫 번째를 밀어냅니다.</p></article><article><h3>B26 · 장식 깃털 (Decorative plumes)</h3><p>상단(활동): 위신 트랙에서 단독 선두이면(동률 불가) 돈 1개와 4점. 하단: 아게라의 호의 +1.</p></article><article><h3>B27 · 더듬이 (Antennae)</h3><p>상단: 언제든 원하는 만큼, 대륙의 뒷면 자원 타일을 몰래 확인하고 되돌려 놓을 수 있습니다.</p></article><article><h3>B28 · 아가미 (Gills)</h3><p>상단: 내 배가 없는 물 지역에도 배가 있는 것처럼 부족 최대 2개와 원자재 1개를 둘 수 있습니다. 목표 칩 27, 이벤트 F7·F20에서는 실제 배만 셉니다.</p></article><article><h3>B29 · 뿔 (Horn)</h3><p>상단(활동): 식량 1개와 아이디어 1개. 추가로 내 지역의 외국 강한 부족 1개를 약하게 할 수 있습니다. 하단: 아게라의 호의 +1.</p></article><article><h3>B30 · 독침 (Venomous sting)</h3><p>상단: 이주 모듈을 쓴 뒤, 마지막으로 이주한 부족이 정착한 지역의 외국 강한 부족을 모두 약하게 합니다(B14·C6 등으로 보호된 부족 제외). 하단: 아게라의 호의 +1.</p></article><article><h3>B31 · 발톱 (Claws)</h3><p>상단: 외국 강한 부족을 황야로 밀어낼 때마다 그 부족을 눕히고 1점을 얻습니다(C6 등으로 약해지지 않는 부족 제외). 하단: 아게라의 호의 +1.</p></article><article><h3>B32 · 발전 기관 (Electric organ)</h3><p>상단(활동): 고른 지역의 강한 부족을 내 것까지 모두 약하게 하고, 눕힌 내 부족마다 2점을 얻습니다. B14·C6로 보호된 부족은 그대로 섭니다. 하단: 아게라의 호의 +1.</p></article></section>
<section><h2>통찰 카드 (C)</h2><article><h3>C1 · 생물학 (Biology)</h3><p>상단: 공급처 마커를 특성 칸에 놓을 때마다 1점.</p></article><article><h3>C2 · 도시 계획 (Urbanism)</h3><p>상단: 대륙에 정착지를 지을 때마다 건설 +1, 3점.</p></article><article><h3>C3 · 항해술 (Navigation)</h3><p>상단: 내 강한 부족이 다른 지역에서 개척된 지역으로 들어갈 때마다 3점.</p></article><article><h3>C4 · 정치 (Politics)</h3><p>하단: 기술·위신·지식 각 +1.</p></article><article><h3>C5 · 물리학 (Physics)</h3><p>상단: 발명 카드를 설치할 때마다 기술 +1, 3점.</p></article><article><h3>C6 · 단열 (Insulation)</h3><p>상단: 빙하가 1개 이상 공개되어 있고, 빙하 영향 지역 전체에 내 부족이 합계 2개 이하일 때만: 그 부족들은 절대 약해지지 않습니다(빙하, 식량 단계, 밀어내기 포함). 세 번째 부족이 들어오면 다시 2개가 될 때까지 효과가 꺼집니다. 하단: 건설 +2.</p></article><article><h3>C7 · 연금술 (Alchemy)</h3><p>상단(활동): 저장 자원 1개를 다른 창고 칸으로 옮기고, 그 칸에 공급처 마커 1개를 더 놓습니다.</p></article><article><h3>C8 · 군주제 (Monarchy)</h3><p>상단: 리셋 B단계에서 활성화 주사위를 굴린 뒤 놓기 전에: 1이 2개 이상이면 돈 1개. 굴린 주사위만 세며, 주사위 칸에 남겨 둔 주사위는 제외합니다. B23 거대한 뇌와 성향 칩 &quot;능숙한 문명&quot;을 먼저 적용할 수 있습니다.</p></article><article><h3>C9 · 공화정 (Republic)</h3><p>상단: 리셋 B단계에서 활성화 주사위를 굴린 뒤 놓기 전에: 2가 하나도 없으면 식량 1개. 굴린 주사위만 세며, 주사위 칸에 남겨 둔 주사위는 제외합니다. B23 거대한 뇌와 성향 칩 &quot;능숙한 문명&quot;을 먼저 적용할 수 있습니다.</p></article><article><h3>C10 · 민주주의 (Democracy)</h3><p>상단: 리셋 B단계에서 활성화 주사위를 굴린 뒤 놓기 전에: 3이 하나도 없으면 아이디어 1개. 굴린 주사위만 세며, 주사위 칸에 남겨 둔 주사위는 제외합니다. B23 거대한 뇌와 성향 칩 &quot;능숙한 문명&quot;을 먼저 적용할 수 있습니다.</p></article><article><h3>C11 · 과두정 (Oligarchy)</h3><p>상단: 리셋 B단계에서 활성화 주사위를 굴린 뒤 놓기 전에: 4가 2개 이상이면 원자재 1개를 창고로 운송하거나 약한 부족 1개를 세웁니다. 굴린 주사위만 세며, 주사위 칸에 남겨 둔 주사위는 제외합니다. B23 거대한 뇌와 성향 칩 &quot;능숙한 문명&quot;을 먼저 적용할 수 있습니다.</p></article><article><h3>C12 · 사회주의 (Socialism)</h3><p>상단: 리셋 B단계에서 활성화 주사위를 굴린 뒤 놓기 전에: 5가 2개 이상이면 내 수입 칩 1개의 행동을 수행합니다. 굴린 주사위만 세며, 주사위 칸에 남겨 둔 주사위는 제외합니다. B23 거대한 뇌와 성향 칩 &quot;능숙한 문명&quot;을 먼저 적용할 수 있습니다.</p></article><article><h3>C13 · 전제정 (Despotism)</h3><p>상단: 리셋 B단계에서 활성화 주사위를 굴린 뒤 놓기 전에: 5가 하나도 없으면 대륙에 원자재 1개를 생산합니다. 굴린 주사위만 세며, 주사위 칸에 남겨 둔 주사위는 제외합니다. B23 거대한 뇌와 성향 칩 &quot;능숙한 문명&quot;을 먼저 적용할 수 있습니다.</p></article><article><h3>C14 · 수학 (Mathematics)</h3><p>상단: 리셋 B단계에서 활성화 주사위를 굴린 뒤 놓기 전에: 6이 1개 이상이면 1점. 굴린 주사위만 세며, 주사위 칸에 남겨 둔 주사위는 제외합니다. B23 거대한 뇌와 성향 칩 &quot;능숙한 문명&quot;을 먼저 적용할 수 있습니다.</p></article><article><h3>C15 · 이성 (Reason)</h3><p>상단: 지식 트랙 원반이 옅은 칸(어두운 숫자)에서 이동을 마치면 다음 흰 숫자 칸으로 더 전진합니다(예: 5 → 7). 지나가기만 하면 해당 없음. 획득 시 이미 그 칸에 있으면 효과 없음. 이 추가 전진은 B22 보호색에 쓸 수 없습니다.</p></article><article><h3>C16 · 신정 (Theocracy)</h3><p>상단(활동): 식량 1개를 반납하고 내 부족이 있는 육지 지역 1곳을 고릅니다. 빈 야영지에 공급처 부족을 최대 2개 눕혀 놓습니다(빈 곳이 1개면 1개). 불 야영지는 점수를 줍니다. 하단: 문화 +1.</p></article><article><h3>C17 · 훈제 식품 (Smoked food)</h3><p>상단: 식량 단계 A에서 서로 다른 지역에 있는 내 부족을 최대 3개 고릅니다. 이번 식량 단계에 식량이 필요 없습니다.</p></article><article><h3>C18 · 저장 창고 (Warehousing)</h3><p>상단: 매 수입 단계 A에서 한 번, 식량이 2개 이상이면 4점.</p></article><article><h3>C19 · 기상학 (Meteorology)</h3><p>상단(활동): 아이디어 1개와 1점. 그 뒤 날씨 표시기를 위나 아래로 1칸 옮길 수 있습니다(도착 칸 효과는 발동하지 않음). 이벤트 단계 A 중에 쓰면 이전 칸 효과는 뒤 순서 문명에게 그대로 적용됩니다. 하단: 활동 모듈 1레벨 업그레이드(가능하면).</p></article><article><h3>C20 · 야금술 (Metallurgy)</h3><p>상단: 교역 모듈로 금·철광석·구리를 돈으로 팔 때 돈 2개를 더 받습니다(금·구리 5, 철광석 4). 점수로 팔 때는 해당 없음.</p></article><article><h3>C21 · 채석 (Quarrying)</h3><p>상단: 매 시대 3단계(추가 발견)에서 내 지역에 인접한 공개된 동굴마다 돌 창고 칸에 마커 1개를 놓습니다. 하단: 아게라의 호의 +1.</p></article><article><h3>C22 · 건축 역학 (Architectural statics)</h3><p>상단: 정착지 건설 비용을 낸 뒤, 낸 자원 중 하나의 창고 칸에 마커 1개를 돌려받습니다.</p></article><article><h3>C23 · 기반 시설 (Infrastructure)</h3><p>하단: 운송 모듈을 레벨 III로 업그레이드합니다.</p></article><article><h3>C24 · 선택 (Selection)</h3><p>상단: 돌연변이 카드를 설치할 때마다, 체력 특성 마커가 나보다 적은 다른 문명은 자기 부족 1개를 약하게 합니다(모든 부족이 B14·C6 등으로 보호되면 면제). 솔로: V.I.C.I는 체력 2개로 보며, 내가 더 많으면 V.I.C.I 부족 1개(가능하면 강한 부족)를 약하게 합니다. 하단: 위신 +1.</p></article><article><h3>C25 · 종교 (Religion)</h3><p>하단: 문화 +3.</p></article><article><h3>C26 · 철학 (Philosophy)</h3><p>하단: 위신·지식 각 +2.</p></article><article><h3>C27 · 수리학 (Hydraulics)</h3><p>하단: 기술·지식·건설 각 +1.</p></article><article><h3>C28 · 탄도학 (Ballistics)</h3><p>하단: 기술·지식 각 +1.</p></article><article><h3>C29 · 천문학 (Astronomy)</h3><p>상단: 게임 종료 점수 보너스. 하단: 지식 +2.</p></article><article><h3>C30 · 애국심 (Patriotism)</h3><p>상단: 게임 종료 점수 보너스. 하단: 위신 +2.</p></article><article><h3>C31 · 자기학 (Magnetism)</h3><p>상단: 게임 종료 점수 보너스. 하단: 기술 +2.</p></article><article><h3>C32 · 광물학 (Mineralogy)</h3><p>상단: 게임 종료 점수 보너스. 하단: 지식 +2.</p></article></section>
<section><h2>건축물 카드 (D)</h2><article><h3>D1 · 여관 (Inn)</h3><p>하단: 체력 특성 마커 2개, 표현력 1개.</p></article><article><h3>D2 · 정원 (Garden)</h3><p>상단: 게임 종료 점수 보너스. 하단: 위신 +2.</p></article><article><h3>D3 · 극장 (Theater)</h3><p>상단(활동): 문화 +1. 하단: 문화 +1.</p></article><article><h3>D4 · 회관 (Hall)</h3><p>하단: 건설 +3.</p></article><article><h3>D5 · 마구간 (Stable)</h3><p>상단(활동): 대륙의 내 농장마다 식량 1개와 1점. 하단: 아게라의 호의 +1.</p></article><article><h3>D6 · 감시탑 (Guard tower)</h3><p>하단: 건설 +1, 체력·시야 특성 마커 각 1개.</p></article><article><h3>D7 · 시장 (Marketplace)</h3><p>하단: 교역 모듈을 레벨 III로 업그레이드합니다.</p></article><article><h3>D8 · 병원 (Hospital)</h3><p>상단: 내 약한 부족이 세워질 때마다 2점. 내 행동이든 다른 카드(예: D13 방앗간)든 상관없습니다.</p></article><article><h3>D9 · 도로 (Road)</h3><p>상단: 번식을 1회 이상 한 차례에, 새로 놓은 부족 1개를 놓은 직후 이주시킬 수 있습니다(여전히 강한 상태라면). 이벤트·수입 단계의 차례도 포함하며, 수입 단계 전체는 한 차례로 봅니다.</p></article><article><h3>D10 · 수도교 (Aqueduct)</h3><p>상단: 식량 단계 A에서 내 정착지마다, 그 건설 부지에 인접한 지역의 내 부족을 최대 2개 고릅니다. 이번 식량 단계에 식량이 필요 없습니다.</p></article><article><h3>D11 · 법원 (Courthouse)</h3><p>상단(활동): 돈 1개와 아이디어 1개를 반납하고 서로 다른 진행 트랙 2개를 각 +1.</p></article><article><h3>D12 · 수도원 (Monastery)</h3><p>상단(활동): 내 약한 부족을 최대 2개 공급처로 돌려보내고 하나당 5점. &quot;데우스 엑스 마키나&quot;로 구할 수 없으며, 실제로 제거한 부족만 점수를 줍니다. 하단: 아게라의 호의 +1.</p></article><article><h3>D13 · 방앗간 (Mill)</h3><p>상단(활동): 지역 1곳에서 모든 문명의 누운 부족을 전부 세우고, 세운 부족마다 1점. 하단: 아게라의 호의 +1.</p></article><article><h3>D14 · 선술집 (Tavern)</h3><p>상단(활동): 식량 1개를 반납하고 3점과 돈 2개. 하단: 아게라의 호의 +2.</p></article><article><h3>D15 · 하수도 (Sewer)</h3><p>상단(활동): 식량 1개를 반납하고 집중 1개, 아이디어 2개, 3점. 하단: 아게라의 호의 +2.</p></article><article><h3>D16 · 저택 (Residence)</h3><p>상단: 장소 단계에서 빙하 효과를 무시합니다. 이벤트 단계 A에서 발동한 부정적 날씨 효과를 무시할 수 있습니다.</p></article><article><h3>D17 · 감옥 (Prison)</h3><p>상단(활동): 외국 강한 부족 1개 머리에 공급처 마커를 올립니다. 그 부족은 지역 밖으로 이주할 수 없습니다. 내 다음 리셋 때 마커를 떼고 2점을 얻은 뒤 마커를 돈 칸에 놓습니다. 부족이 약해져도 마커는 남고, 부족이 제거되면 즉시 2점과 돈을 받습니다. 하단: 아게라의 호의 +1.</p></article><article><h3>D18 · 대장간 (Forge)</h3><p>상단(활동): 기술 +1. 하단: 기술 +1.</p></article><article><h3>D19 · 포룸 (Forum)</h3><p>상단(활동): 위신 +1. 하단: 위신 +1.</p></article><article><h3>D20 · 도서관 (Library)</h3><p>상단(활동): 지식 +1. 하단: 지식 +1.</p></article><article><h3>D21 · 성벽 (City walls)</h3><p>상단(활동): 건설 +1. 하단: 건설 +1.</p></article><article><h3>D22 · 양조장 (Brewery)</h3><p>하단: 기술·위신·문화 각 +1.</p></article><article><h3>D23 · 성 (Castle)</h3><p>하단: 건설 +3.</p></article><article><h3>D24 · 지구라트 (Ziggurat)</h3><p>하단: 건설 +4.</p></article><article><h3>D25 · 원형 경기장 (Arena)</h3><p>하단: 위신 +3, 건설 +2.</p></article><article><h3>D26 · 천문대 (Observatory)</h3><p>하단: 기술 +3, 지식 +2.</p></article><article><h3>D27 · 대학 (University)</h3><p>하단: 기술 +2, 지식 +3.</p></article><article><h3>D28 · 피라미드 (Pyramid)</h3><p>하단: 건설 +2, 문화 +3.</p></article><article><h3>D29 · 신전 (Temple)</h3><p>하단: 건설·문화 각 +3.</p></article><article><h3>D30 · 학교 (School)</h3><p>하단: 지식 +2, 지능 특성 마커 1개.</p></article><article><h3>D31 · 등대 (Lighthouse)</h3><p>하단: 건설 +2, 시야 특성 마커 2개.</p></article><article><h3>D32 · 분수 (Fountain)</h3><p>상단: 게임 종료 점수 보너스. 하단: 건설 +2.</p></article></section>
<section><h2>업적 카드 (E)</h2><article><h3>E1 · 영웅담 (Sagas)</h3><p>하단: 지식·문화 각 +2.</p></article><article><h3>E2 · 무두질 공방 (Tannery)</h3><p>상단: 사냥할 때마다 돈 1개와 2점(부양 모듈 III의 연속 사냥은 각각 적용). 하단: 목표 칩 1개 획득 또는 설치.</p></article><article><h3>E3 · 지도 제작 (Cartography)</h3><p>상단: 게임 종료 점수 보너스. 하단: 지식 +2.</p></article><article><h3>E4 · 광택 (Polish)</h3><p>상단: 수입 단계 B에서 조각상 점수를 계산할 때 조각상마다 1점 추가. 하단: 목표 칩 1개 획득 또는 설치.</p></article><article><h3>E5 · 놀이 (Games)</h3><p>하단: 지식 +1, 문화 +2.</p></article><article><h3>E6 · 다이너마이트 (Dynamite)</h3><p>상단: 산·언덕 지역에 생산하는 원자재가 2배가 됩니다. 예(생산 III, 원자재 4개): 산 1 + 초원 1 + 언덕 2 → 돌 2, 약초 1, 점토 4. 하단: 목표 칩 1개 획득 또는 설치.</p></article><article><h3>E7 · 농업 (Agriculture)</h3><p>하단: 나무·파피루스·목화 창고 칸에 마커를 1개씩 놓습니다.</p></article><article><h3>E8 · 광산 (Mine)</h3><p>하단: 금·철광석·구리 창고 칸에 마커를 1개씩 놓습니다.</p></article><article><h3>E9 · 어업 (Fishing)</h3><p>상단: 물에 인접한 육지 지역에서 사냥하면 사냥표의 물 칸 보상을 받을 수 있습니다(예: 사막에서 3이면 식량 1개 대신 4개). 사냥 토큰은 사냥한 지역에 놓습니다. 하단: 목표 칩 1개 획득 또는 설치.</p></article><article><h3>E10 · 달력 (Calendar)</h3><p>상단: 매 시대 마지막 행동 라운드의 내 차례에 모듈 활성화와 리셋을 둘 다 합니다(순서 자유). 주사위 칸에 주사위가 3개보다 많이 남아 있어도 됩니다. 하단: 목표 칩 1개 획득 또는 설치.</p></article><article><h3>E11 · 화덕 (Oven)</h3><p>상단: 날씨 표시기가 추움 쪽으로 내려가며 어두운 선을 넘을 때마다(이벤트 단계 A 또는 C19 기상학) 선 하나당 3점. 하단: 목표 칩 1개 획득 또는 설치.</p></article><article><h3>E12 · 화폐 (Currency)</h3><p>상단(활동): 돈 2개.</p></article><article><h3>E13 · 삽 (Shovel)</h3><p>상단: 사막·늪 지역에 생산하는 원자재가 2배가 됩니다. 예(생산 III, 원자재 4개): 사막 1 + 초원 1 + 늪 2 → 구리 2, 약초 1, 석탄 4. 하단: 목표 칩 1개 획득 또는 설치.</p></article><article><h3>E14 · 관개 (Irrigation)</h3><p>상단: 숲·초원 지역에 생산하는 원자재가 2배가 됩니다. 예(생산 III, 원자재 4개): 숲 1 + 산 1 + 초원 2 → 나무 2, 옥 1, 금 4. 하단: 목표 칩 1개 획득 또는 설치.</p></article><article><h3>E15 · 사법 제도 (Judiciary)</h3><p>하단: 주 모듈 업그레이드를 2회 합니다(같은 모듈 2회 또는 두 모듈 각 1회).</p></article><article><h3>E16 · 요리 (Cooking)</h3><p>상단(활동): 어디서든 내 약한 부족을 최대 3개 세우고 3점. 하단: 아게라의 호의 +1.</p></article><article><h3>E17 · 무덤 (Graves)</h3><p>상단: 내 부족을 대륙에서 제거해 공급처로 돌려보낼 때마다 3점.</p></article><article><h3>E18 · 의식 (Rituals)</h3><p>상단: 매 장소 단계에서 장소 효과를 처리한 뒤, 내 부족이 3개 이상 있는 지역마다 5점.</p></article><article><h3>E19 · 제례 (Ceremonies)</h3><p>상단: 문화 트랙 원반이 옅은 칸(어두운 숫자)에서 이동을 마치면 다음 흰 숫자 칸으로 더 전진합니다(예: 5 → 7). 지나가기만 하면 해당 없음. 획득 시 이미 그 칸에 있으면 효과 없음. 이 추가 전진은 B22 보호색에 쓸 수 없습니다.</p></article><article><h3>E20 · 보존 (Preservation)</h3><p>상단: 연구 카드를 설치하며 저장 자원을 낸 뒤, 낸 자원 중 하나의 창고 칸에 마커 1개를 돌려받습니다. 실제로 낸 자원만 해당합니다(A14 유리 등으로 충족한 칸 제외).</p></article><article><h3>E21 · 언어 (Language)</h3><p>하단: 표현력 특성 마커 3개.</p></article><article><h3>E22 · 위생 (Hygiene)</h3><p>하단: 체력 특성 마커 2개.</p></article><article><h3>E23 · 미술 (Fine arts)</h3><p>하단: 건설·문화 각 +2.</p></article><article><h3>E24 · 변소 (Latrine)</h3><p>하단: 건설·문화 각 +1.</p></article><article><h3>E25 · 가구 (Furniture)</h3><p>하단: 기술·위신·건설 각 +1.</p></article><article><h3>E26 · 활판 인쇄 (Letterpress)</h3><p>하단: 지식 +2, 문화 +1.</p></article><article><h3>E27 · 시 (Poetry)</h3><p>하단: 위신 +1, 문화 +2.</p></article><article><h3>E28 · 음악 (Music)</h3><p>하단: 위신·문화 각 +2.</p></article><article><h3>E29 · 축제 (Festivities)</h3><p>하단: 위신·건설·문화 각 +1.</p></article><article><h3>E30 · 장신구 (Jewelry)</h3><p>하단: 위신 +3.</p></article><article><h3>E31 · 연극 (Stage play)</h3><p>상단: 게임 종료 점수 보너스. 하단: 문화 +2.</p></article><article><h3>E32 · 향수 (Perfume)</h3><p>상단: 게임 종료 점수 보너스. 하단: 위신 +2.</p></article></section>
<section><h2>이벤트 카드 (F)</h2><article><h3>F1 · 여름의 시작 (Beginning of summer)</h3><p>각 문명: 내 부족이 있는 늪·사막 지역마다 3점, 그리고 각 지역에 원자재 1개를 생산할 수 있습니다. E13 삽 사용 가능, B13 코 사용 불가.</p></article><article><h3>F2 · 영감 (Inspiration)</h3><p>문화 트랙 단독 선두만: 공개 업적 더미 맨 위 카드를 무료로 즉시 설치합니다(모든 비용 칸 비활성, 더미는 평소대로 보충). B5 겹눈을 쓸 수 있습니다.</p></article><article><h3>F3 · 대관식 (Coronation)</h3><p>위신 트랙 단독 선두만: 6점과 돈 3개.</p></article><article><h3>F4 · 운석 충돌 (Meteoritic strike)</h3><p>농장 최다(동률 포함): 내 농장 1개를 콘솔로 되돌리고 2점과 저장 금 1개를 얻습니다.</p></article><article><h3>F5 · 깨달음 (Epiphany)</h3><p>시야 특성 마커가 2개 이상인 각 문명: 아게라의 호의 +1 또는 수입 칩 1개의 행동.</p></article><article><h3>F6 · 돌파구 (Breakthrough)</h3><p>아이디어 마커 최다(동률 포함): 기술 +2 또는 지식 +2.</p></article><article><h3>F7 · 겨울의 시작 (Beginning of winter)</h3><p>각 문명: 내 부족과 농장 또는 배가 함께 있는 지역마다 2점, 그리고 각 지역에 원자재 1개를 생산할 수 있습니다(배는 홈이 비어 있을 때만). A13·A18·E6·E13·E14 사용 가능, B13 코 사용 불가.</p></article><article><h3>F8 · 도시화 (Urbanization)</h3><p>각 문명, 대륙의 내 정착지 수에 따라: 1개 → 문화 +1, 2개 → 문화·건설 각 +1, 3개 → 문화 +2·건설 +1, 4개 → 문화·건설 각 +2.</p></article><article><h3>F9 · 건설의 진보 (Building progress)</h3><p>건설 트랙 단독 선두만, 택1: A) 콘솔에서 아직 짓지 않은 정착지 하나의 건설 비용 자원을 창고에 얻습니다(예: 가장 오른쪽은 모래·철광석·점토). B) 공급처 마커를 조각상으로 아무 건설 부지에 놓고(평소 조건 무시) 아무 진행 트랙 +1.</p></article><article><h3>F10 · 아게라를 위한 잔치 (A feast for Agera)</h3><p>대륙의 조각상이 단독 최다일 때만: 수입 칩 1개 획득.</p></article><article><h3>F11 · 계몽 (Enlightenment)</h3><p>활성화 주사위 최다(동률 포함, 콘솔 위·아래 모두 셈): 아무 진행 트랙 +1. 운명 주사위 최다(동률 포함): 아무 진행 트랙 +1.</p></article><article><h3>F12 · 봄의 시작 (Beginning of spring)</h3><p>각 문명: 내 부족이 있는 초원·언덕 지역마다 2점, 그리고 각 지역에 원자재 1개를 생산할 수 있습니다. E6·E14 사용 가능, B13 코 사용 불가.</p></article><article><h3>F13 · 장날 (Market day)</h3><p>침착 특성 마커가 2개 이상인 각 문명, 택1: A) 이미 마커가 있는 창고 칸 하나에 마커 2개 추가. B) 창고 칸 하나에서 저장 자원을 최대 2개 반납하고 하나당 3점.</p></article><article><h3>F14 · 천재적 발상 (Stroke of genius)</h3><p>기술 트랙 단독 선두만: 공개 발명 더미 맨 위 카드를 무료로 즉시 설치합니다(모든 비용 칸 비활성, 더미는 평소대로 보충). B5 겹눈을 쓸 수 있습니다.</p></article><article><h3>F15 · 번뜩임 (Brainwave)</h3><p>지식 트랙 단독 선두만: 공개 통찰 더미 맨 위 카드를 무료로 즉시 설치합니다(모든 비용 칸 비활성, 더미는 평소대로 보충). B5 겹눈을 쓸 수 있습니다.</p></article><article><h3>F16 · 찬탄 (Admiration)</h3><p>저장된 금·옥·구리 합계가 단독 최다일 때만: 위신 +3.</p></article><article><h3>F17 · 부패 (Corruption)</h3><p>돈이 단독 최다일 때만: 목표 칩 1개를 조건 없이 설치합니다.</p></article><article><h3>F18 · 가을의 시작 (Beginning of fall)</h3><p>각 문명: 내 부족이 있는 숲·산 지역마다 2점, 그리고 각 지역에 원자재 1개를 생산할 수 있습니다. A13·E6·E14 사용 가능, B13 코 사용 불가.</p></article><article><h3>F19 · 진화의 도약 (Leap in evolution)</h3><p>저장 자원이 단독 최다일 때만: 저장 자원을 최대 3개까지 원하는 특성 칸으로 옮깁니다.</p></article><article><h3>F20 · 해일 (Tsunami)</h3><p>대륙의 배 최다(동률 포함, B28 아가미 제외 실제 배만): 배 1척을 콘솔로 되돌립니다. 배의 부족은 공급처로(데우스 엑스 마키나 불가). 배의 원자재는 홈에 그대로 두고, 없으면 홈에 마커를 넣습니다. 그 뒤 2점, 저장 나무 1개, 저장 목화 1개. B28 아가미가 있으면 부족과 원자재는 물 지역에 남습니다.</p></article></section>
<section><h2>목표 칩</h2><article><h3>1–4 · 지형에 농장과 부족</h3><p>그려진 지형 중 내 농장 1개와 부족 1개 이상이 함께 있는 지역이 1곳 이상.</p></article><article><h3>5–8 · 지형에 부족 2개</h3><p>그려진 지형 중 내 부족이 2개 이상인 지역이 1곳 이상.</p></article><article><h3>9–10 · 지형에 부족 3개</h3><p>그려진 지형 중 내 부족이 3개 이상인 지역이 1곳 이상.</p></article><article><h3>11–16 · 같은 지형 2곳</h3><p>그려진 지형 중 내 부족이 있는 지역이 2곳 이상.</p></article><article><h3>17–24 · 장소 옆 부족 2개</h3><p>그려진 장소 종류에 인접한 지역에 내 부족 2개 이상(같은 지역·장소든 다른 곳이든 무관).</p></article><article><h3>25 · 정착지 2개</h3><p>대륙에 내 정착지 2개 이상.</p></article><article><h3>26 · 조각상 2개</h3><p>대륙에 내 조각상 2개 이상(건설 부지 같아도 됨).</p></article><article><h3>27 · 배 2척</h3><p>내 배 2척이 모두 대륙에 있어야 합니다(부족·원자재 유무 무관).</p></article><article><h3>28 · 활성화 주사위 8개</h3><p>활성화 주사위 8개 이상(콘솔 위·아래 모두 셈). 시작이 6개이므로 2개를 더 얻어야 합니다.</p></article><article><h3>29 · 운명 주사위 3개</h3><p>운명 주사위 3개 이상. 시작이 1개이므로 2개를 더 얻어야 합니다.</p></article><article><h3>30–34 · 같은 종류 연구 카드 2장</h3><p>단계 구역에 그려진 종류의 연구 카드 2장 이상 설치.</p></article><article><h3>35–39 · 진행 트랙 3칸</h3><p>그려진 진행 트랙의 내 원반이 3번 칸 이상(정오표로 추가된 설명).</p></article><article><h3>40–45 · 같은 특성 마커 2개</h3><p>그려진 종류의 특성 마커 2개 이상.</p></article><article><h3>46–63 · 저장 자원 1개 지불</h3><p>그려진 종류의 저장 자원 1개를 공급처로 반납.</p></article><article><h3>64 · 식량 3개 지불</h3><p>식량 마커 3개를 공급처로 반납.</p></article><article><h3>65 · 돈 3개 지불</h3><p>돈 마커 3개를 공급처로 반납.</p></article></section>
<section><h2>수입 칩</h2><article><h3>호의 판정: 기술</h3><p>호의 판정을 해서 성공하면 기술 +1. 또는 1점.</p></article><article><h3>호의 판정: 지식</h3><p>호의 판정을 해서 성공하면 지식 +1. 또는 1점.</p></article><article><h3>호의 판정: 위신</h3><p>호의 판정을 해서 성공하면 위신 +1. 또는 1점.</p></article><article><h3>호의 판정: 건설</h3><p>호의 판정을 해서 성공하면 건설 +1. 또는 1점.</p></article><article><h3>호의 판정: 문화</h3><p>호의 판정을 해서 성공하면 문화 +1. 또는 1점.</p></article><article><h3>호의 판정: 연구 카드</h3><p>호의 판정을 해서 성공하면 연구 카드 1장 획득. 또는 1점.</p></article><article><h3>호의 판정: 이주</h3><p>호의 판정을 해서 성공하면 이주 1회. 또는 1점.</p></article><article><h3>호의 판정: 번식</h3><p>호의 판정을 해서 성공하면 번식 1회. 또는 1점.</p></article><article><h3>호의 판정: 목표 칩 설치</h3><p>호의 판정을 해서 성공하면 목표 칩 1개 설치. 또는 1점.</p></article><article><h3>목표 칩 획득</h3><p>목표 칩 1개 획득. 또는 1점.</p></article><article><h3>운송 또는 세우기</h3><p>원자재 1개를 창고로 운송, 또는 약한 부족 1개 세우기, 또는 1점.</p></article><article><h3>집중</h3><p>집중 마커 1개. 또는 1점.</p></article><article><h3>돈</h3><p>돈 마커 1개. 또는 1점.</p></article><article><h3>변이</h3><p>특성 마커 1개를 다른 특성 칸으로 옮김. 또는 1점.</p></article><article><h3>생산·아이디어·식량</h3><p>원자재 1개 생산, 또는 아이디어 1개, 또는 식량 1개, 또는 1점.</p></article></section>
<section><h2>성향 칩</h2><article><h3>능숙한 문명 (Adept civilization)</h3><p>리셋 B단계에서 굴린 뒤 놓기 전에 굴린 활성화 주사위 하나를 원하는 면으로 돌립니다(남겨 둔 주사위 제외).</p></article><article><h3>민첩한 문명 (Agile civilization)</h3><p>매 식량 단계에서 부족을 먹이기 전에 사냥 1회.</p></article><article><h3>야심 찬 문명 (Ambitious civilization)</h3><p>수입 칩을 설치할 때마다 이어서 연구 카드 1장을 얻을 수 있습니다.</p></article><article><h3>호기심 많은 문명 (Curious civilization)</h3><p>언제든 원하는 만큼, 내 지역에 인접한 뒷면 장소와 뒷면 자원 타일을 몰래 확인할 수 있습니다.</p></article><article><h3>외교적인 문명 (Diplomatic civilization)</h3><p>생산 모듈의 평소 행동 전이나 후에, 내 부족은 없고 다른 문명 부족이 있는 육지 지역에 원자재 2개를 생산합니다.</p></article><article><h3>유연한 문명 (Flexible civilization)</h3><p>리셋할 때마다 아이디어 마커 1개 추가.</p></article><article><h3>독창적인 문명 (Ingenious civilization)</h3><p>수면 모듈을 활성화하면 평소 보상(집중 1개 또는 아이디어 2개) 뒤에 손의 통찰 또는 발명 카드 1장을 설치할 수 있습니다(설치 규칙 적용).</p></article><article><h3>상업적인 문명 (Mercantile civilization)</h3><p>연구 카드를 설치할 때 요구 저장 자원을 최대 2개까지 돈으로 대신 냅니다: 1개 = 돈 2개, 2개 = 돈 5개. 특성 요구는 대신할 수 없습니다.</p></article><article><h3>체계적인 문명 (Methodical civilization)</h3><p>목표 칩을 설치할 때마다 이어서 집중 마커 2개를 얻을 수 있습니다.</p></article><article><h3>영리한 문명 (Smart civilization)</h3><p>3단계에 설치하는 연구 카드는 왼쪽 비용 칸 2개만, 4단계는 왼쪽 3개만 충족하면 됩니다.</p></article><article><h3>끈질긴 문명 (Stubborn civilization)</h3><p>호의 판정·사냥·행운의 발견에서 처음 굴린 운명 주사위가 마음에 들지 않으면 전부 한 번 다시 굴립니다.</p></article><article><h3>강인한 문명 (Tenacious civilization)</h3><p>장소 단계: 그림울프 협곡으로 식량을 잃거나 빙하로 부족이 약해지지 않습니다. 이벤트 단계 A: 식량이나 부족을 잃지 않습니다.</p></article></section>
<section><h2>장소 타일</h2><article><h3>×7 · 건설 부지 (Building ground)</h3><p>6개 + 시작 섬 1개. 발견 시 1점. 내 지역이 인접하면 건축 모듈로 이곳에 지을 수 있습니다. 부지마다 내 건물 최대 2개: 정착지 1 + 조각상 1, 또는 조각상 2.</p></article><article><h3>×3 · 동굴 (Cave)</h3><p>발견 시 3점. 이주할 때 아무 동굴에든 인접한 지역들은 서로 인접한 것으로 봅니다.</p></article><article><h3>×3 · 신비한 참나무 (Mystic oak)</h3><p>발견 시 1점. 장소 단계에서 인접한 내 지역마다 지형에 따른 점수를 얻습니다(부족 수 무관).</p></article><article><h3>×2 · 빙하 (Glacier)</h3><p>발견 시 4점. 장소 단계에서 인접 지역에 내 강한 부족이 있으면 그중 1개를 약하게 합니다(빙하당 최대 1개). 약한 부족만 있으면 면제.</p></article><article><h3>×2 · 그림울프 협곡 (Gorge of the Grimwolves)</h3><p>발견 시 5점. 장소 단계에서 인접한 내 지역이 있으면 식량 1개를 반납합니다(협곡당 최대 1개). 식량이 없으면 면제.</p></article><article><h3>×2 · 화산 (Volcano)</h3><p>발견 시 4점. 인접 지역에는 농장이 있을 수 없습니다. 공개될 때 있던 농장은 각자 콘솔로 돌아갑니다.</p></article><article><h3>×2 · 버섯 계곡 (Mushroom valley)</h3><p>발견 시 2점. 인접 지역에서 사냥하면 식량 1개 추가.</p></article><article><h3>×2 · 성스러운 바위 (Holy rock)</h3><p>발견 시 2점. 번식 모듈을 활성화할 때마다 먼저 호의 판정을 합니다. 성공하면 성스러운 바위에 인접한 내 지역 1곳에서 번식 1회를 추가로 합니다.</p></article><article><h3>×2 · 숨겨진 석굴 (Hidden grotto)</h3><p>발견 시 2점. 생산 모듈을 활성화할 때마다 먼저, 인접한 내 지역 1곳에 원자재 1개를 생산하고 그곳의 원자재 1개를 창고로 운송할 수 있습니다(순서 자유).</p></article><article><h3>장소 공통 규칙 (Sites in general)</h3><p>공개된 장소는 직접 닿은 지역에만 영향을 줍니다. 뒷면 장소는 효과가 없습니다. 장소마다 따로 적용되므로 같은 종류 2개가 한 지역에 닿으면 둘 다 적용됩니다. 인쇄된 점수는 발견한 문명만 받습니다.</p></article></section>
<section><h2>주 모듈</h2><article><h3>활동 (Activity)</h3><p>I: 콘솔에서 쓸 수 있는 활동 1회. II: 서로 다른 활동 최대 2회. III: 활동 최대 2회(같은 활동 2회 가능).</p></article><article><h3>건축 (Building)</h3><p>I: ① 건설 1회(농장·배·정착지·조각상). ② 손의 건축물 카드 1장 설치. II: ① 같은 종류 건설 최대 2회. ② 손의 건축물 카드 1장 설치. III: ① 종류 무관 건설 최대 2회. ② 건축물 카드 1장 설치. 비용 칸 1개를 무시하거나(유일한 활성 칸이면 불가) 건축물 카드 1장을 더 설치합니다.</p></article><article><h3>탐험 (Exploration)</h3><p>I: ① 내 지역에 인접한 뒷면 장소를 모두 공개하고 점수를 얻습니다. ② 행운의 발견 1회(내 부족이 있는 육지 지형을 고르고 운명 주사위를 굴려 주사위 하나에 해당하는 그 지형의 자원을 얻음). II: ① 같은 장소들 + 아무 장소 1곳을 공개하고 점수와 2점 추가. ② 행운의 발견 1회. III: ① 같은 장소들 + 아무 장소 1곳을 공개하고 점수와 4점 추가. ② 행운의 발견 2회.</p></article><article><h3>연구 (Research)</h3><p>I: ① 공개 또는 비공개 연구 더미 맨 위 카드 1장. ② 비공개 더미 1~2개에서 2장을 뽑아 1장을 갖고 나머지는 더미 아래로. II: ① 레벨 I과 같음. ② 비공개 4장을 뽑아 2장을 갖고 나머지는 더미 아래로. III: ① 맨 위 카드 가져오기 2회. ② 레벨 II와 같음.</p></article><article><h3>발명 (Invention)</h3><p>I: ① 수입 칩 1개의 행동. ② 손의 발명 카드 1장 설치. II: ① 수입 칩 행동 최대 2회(같은 칩 2회 가능). ② 손의 발명 카드 1장 설치. III: ① 수입 칩 행동 최대 2회(같은 칩 2회 가능). ② 발명 카드 1장 설치. 비용 칸 1개를 무시하거나(유일한 활성 칸이면 불가) 발명 카드 1장을 더 설치합니다.</p></article><article><h3>통찰 (Insight)</h3><p>I: ① 아이디어 마커 3개. ② 손의 통찰 카드 1장 설치. II: ① 아이디어 마커 6개. ② 손의 통찰 카드 1장 설치. III: ① 아이디어 마커 6개. ② 통찰 카드 1장 설치. 비용 칸 1개를 무시하거나(유일한 활성 칸이면 불가) 통찰 카드 1장을 더 설치합니다.</p></article><article><h3>업적 (Achievement)</h3><p>I: ① 활성화 주사위 1개(즉시 굴림) 또는 운명 주사위 1개. 진열대에 없으면 가장 많이 가진 문명에게서 가져옵니다(내가 단독 최다면 불가). ② 손의 업적 카드 1장 설치. II: ① 활성화 주사위 1개와 운명 주사위 1개(진열대가 비면 같은 규칙). ② 손의 업적 카드 1장 설치. III: ① 활성화 주사위 1개와 운명 주사위 1개(진열대가 비면 같은 규칙). ② 업적 카드 1장 설치. 비용 칸 1개를 무시하거나(유일한 활성 칸이면 불가) 업적 카드 1장을 더 설치합니다.</p></article><article><h3>돌연변이 (Mutation)</h3><p>I: ① 특성 마커 1개를 아무 특성으로 옮김. ② 손의 돌연변이 카드 1장 설치. II: ① 특성 마커 최대 2개를 옮김. ② 손의 돌연변이 카드 1장 설치. III: ① 특성 마커 최대 2개를 옮김. ② 돌연변이 카드 1장 설치. 비용 칸 1개를 무시하거나(유일한 활성 칸이면 불가) 돌연변이 카드 1장을 더 설치합니다.</p></article><article><h3>교역 (Trade)</h3><p>I: 판매 1회 및/또는 구매 1회(순서 자유, 세부 내용은 콘솔). II: 판매 최대 2회, 구매 최대 2회. III: 돈 2개를 얻고 판매 최대 2회, 구매 최대 2회.</p></article><article><h3>계획 (Planning)</h3><p>I: ① 조건을 충족한 목표 칩 1개를 목표 구역에서 설치. ② 계획 마커 2개를 한 주사위 칸에 놓음. II: ① 레벨 I과 같음. ② 계획 마커 3개를 한 주사위 칸에. III: ① 목표 칩 설치 및/또는 진열대에서 새 목표 칩 획득(순서 자유). ② 레벨 II와 같음.</p></article><article><h3>생산 (Production)</h3><p>I: 내 지역에 원자재 2개 생산. 호의 판정 성공 시 생산 전이나 후에 원자재 1개를 창고로 운송. II: 원자재 3개 생산, 전이나 후에 1개 운송. III: 원자재 4개 생산, 전이나 후에 2개 운송.</p></article><article><h3>운송 (Transport)</h3><p>I: 아무 지역에서 내 원자재를 최대 3개 창고로 가져옴(그 지역에 부족이 없어도 됨). II: 최대 6개. III: 전부. 이때 배에서 가져온 원자재는 아무 종류로나 저장 가능.</p></article><article><h3>이주 (Migration)</h3><p>I: 이주 1회: 강한 부족을 인접 지역으로 옮겨 빈 또는 점유된 야영지(또는 내 배)에 정착. 다른 부족을 황야로 밀어내면 이주한 부족을 약하게 함. 미개척 지역이면 개척. II: 먼저 호의 판정: 성공 2회, 실패 1회. 같은 부족이 2번 움직이면 마지막 지역에 정착하고 앞 지역은 통과만. III: 먼저 호의 판정: 성공 3회, 실패 2회. 여러 번 움직인 부족은 마지막 지역에만 정착.</p></article><article><h3>번식 (Procreation)</h3><p>I: 번식 1회: 내 지역의 빈 또는 점유된 야영지(또는 내 배)에 새 부족을 세워 놓음(지역이 없으면 아무 곳). 다른 부족을 밀어내면 새 부족을 약하게 함. II: 먼저 호의 판정: 성공 2회, 실패 1회. III: 번식 2회. 이어서 호의 판정 성공 시 약한 부족 1개를 세움.</p></article><article><h3>부양 (Sustenance)</h3><p>I: ① 사냥 1회(사냥 토큰이 없는 내 지역, 운명 주사위를 굴려 주사위 하나로 사냥표의 식량 획득, 사냥 토큰 놓기). ② 약한 부족 1개 세우기. II: ① 레벨 I과 같음. ② 약한 부족 최대 3개 세우기. III: ① 내 지역 최대 2곳에서 사냥. ② 약한 부족 최대 4개 세우기.</p></article><article><h3>리셋 (Reset)</h3><p>주사위 칸에 활성화 주사위가 3개 이하일 때만(계획 마커는 세지 않음). 단계 표시기를 다음 리셋 칸으로 옮기고, 사용한 주사위를 회수합니다. 칸에 남은 주사위는 하나씩 다시 굴릴지 정합니다. 굴려서 배치한 뒤 리셋 마커를 아이디어 칸이나 식량 칸으로 옮깁니다.</p></article></section></noscript>
